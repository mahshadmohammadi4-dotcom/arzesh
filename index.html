"use strict";

/* =========================================================================
   Theme Manager
   ========================================================================= */

var THEME_STORAGE_KEY = 'tahlilyar-theme';


function getSavedTheme(){

  try{

    var theme =
      localStorage.getItem(
        THEME_STORAGE_KEY
      );

    if (
      theme === 'light' ||
      theme === 'dark' ||
      theme === 'system'
    ){
      return theme;
    }

  } catch (e){}

  return 'system';
}


function applyTheme(theme){

  if (
    theme === 'light' ||
    theme === 'dark'
  ){

    document.documentElement.setAttribute(
      'data-theme',
      theme
    );

  }

  else{

    document.documentElement.removeAttribute(
      'data-theme'
    );

  }

  syncThemeSwitcher();

}


function setTheme(theme){

  if (
    theme !== 'light' &&
    theme !== 'dark' &&
    theme !== 'system'
  ){
    theme = 'system';
  }

  try{

    localStorage.setItem(
      THEME_STORAGE_KEY,
      theme
    );

  } catch (e){}

  applyTheme(theme);

}


function syncThemeSwitcher(){

  var current =
    getSavedTheme();

  var buttons =
    document.querySelectorAll(
      '[data-theme-choice]'
    );

  buttons.forEach(function(button){

    var active =
      button.getAttribute(
        'data-theme-choice'
      ) === current;

    button.classList.toggle(
      'active',
      active
    );

    button.setAttribute(
      'aria-pressed',
      active ? 'true' : 'false'
    );

  });

}


function initTheme(){

  applyTheme(
    getSavedTheme()
  );

}

/* =========================================================================
   داده‌های نمونه (In-memory mock — چیزی در سرور ذخیره نمی‌شود)

/* =========================================================================
   ریاضیات مالی (عیناً منطبق با موتور محاسباتی بک‌اند)
   ========================================================================= */
function npv(rate, investment, cfs){
  var pv = cfs.reduce(function(s,cf,i){ return s + cf/Math.pow(1+rate, i+1); }, 0);
  return pv - investment;
}
function irr(investment, cfs){
  var lo=-0.99, hi=10;
  var nLo = npv(lo,investment,cfs), nHi = npv(hi,investment,cfs);
  if (nLo===0) return lo; if (nHi===0) return hi;
  if (Math.sign(nLo)===Math.sign(nHi)) return null;
  for (var i=0;i<100;i++){
    var mid=(lo+hi)/2, nMid=npv(mid,investment,cfs);
    if (Math.abs(nMid) < 1e-7) return mid;
    if (Math.sign(nMid)===Math.sign(npv(lo,investment,cfs))) lo=mid; else hi=mid;
  }
  return (lo+hi)/2;
}
function paybackPeriod(investment, cfs){
  var cum=0;
  for (var i=0;i<cfs.length;i++){
    var prev=cum; cum+=cfs[i];
    if (cum>=investment){ var rem=investment-prev; return i + (cfs[i]===0?0:rem/cfs[i]); }
  }
  return null;
}
function bcr(rate, investment, cfs){
  if (investment===0) return null;
  var pv = cfs.reduce(function(s,cf,i){ return s + cf/Math.pow(1+rate, i+1); }, 0);
  return pv/investment;
}
function terminalValue(lastCf, g, r){ if (r<=g) return null; return lastCf*(1+g)/(r-g); }
function enterpriseValue(rate, cfs, g){
  if (cfs.length===0) return null;
  var pv = cfs.reduce(function(s,cf,i){ return s + cf/Math.pow(1+rate, i+1); }, 0);
  var tv = terminalValue(cfs[cfs.length-1], g, rate);
  if (tv===null) return null;
  return pv + tv/Math.pow(1+rate, cfs.length);
}

/* =========================================================================
   حل‌کننده‌ی فیلد و کاتالوگ شاخص‌ها / صفحات
   ========================================================================= */
var SOURCE_PRIORITY = ['MANUAL_ENTRY','ACCOUNTING_SYSTEM','EXTERNAL_API','DOCUMENT_OCR','AI_SUGGESTED'];
var SOURCE_LABEL = { MANUAL_ENTRY:'ورود دستی', DOCUMENT_OCR:'استخراج از سند (OCR)', EXTERNAL_API:'API خارجی', ACCOUNTING_SYSTEM:'سیستم حسابداری', AI_SUGGESTED:'پیشنهاد هوش مصنوعی' };

function latestPerSource(f){
  var by = {};
  f.values.forEach(function(v){ if (!by[v.source] || v.at > by[v.source].at) by[v.source]=v; });
  return by;
}
function resolveFieldId(f, project){
  if (f.pinnedId) return f.pinnedId;
  var order = (project && project.sourcePriorityOverride) || SOURCE_PRIORITY;
  var by = latestPerSource(f);
  for (var i=0;i<order.length;i++){ if (by[order[i]]) return by[order[i]].id; }
  return null;
}
function fieldHasConflict(f){
  var by = latestPerSource(f);
  var distinct = {};
  Object.keys(by).forEach(function(s){ distinct[JSON.stringify(by[s].value)] = true; });
  return Object.keys(distinct).length > 1;
}
/* وضعیت هر دیتاپوینت برای نشانگر رنگی (آبی=تغییر کاربر، قرمز=تعارض، خنثی=داده اصلی) */
function computeFieldState(f, project){
  var by = latestPerSource(f);
  var sources = Object.keys(by);
  var distinct = {};
  sources.forEach(function(s){ distinct[JSON.stringify(by[s].value)] = s; });
  var hasConflict = Object.keys(distinct).length > 1;
  var resolvedId = resolveFieldId(f, project);
  var resolved = f.values.filter(function(v){ return v.id===resolvedId; })[0];
  var modified = !!(f.pinnedId && resolved && resolved.source==='MANUAL_ENTRY');
  /* مقدار اصلی: اولین مأخذ غیردستی با بالاترین اولویت */
  var original = null;
  var order = (project && project.sourcePriorityOverride) || SOURCE_PRIORITY;
  for (var i=0;i<order.length;i++){
    if (by[order[i]] && order[i]!=='MANUAL_ENTRY'){ original = by[order[i]].value; break; }
  }
  var status = hasConflict ? 'conflict' : (modified ? 'modified' : 'original');
  return {
    status: status,
    hasConflict: hasConflict,
    modified: modified,
    resolvedId: resolvedId,
    resolved: resolved,
    sourceCount: sources.length,
    sources: sources,
    changedValue: resolved ? resolved.value : null,
    originalValue: original
  };
}
function fieldStateLabel(state){
  if (state.status==='conflict') return 'تعارض منابع';
  if (state.status==='modified') return 'تغییر توسط کاربر';
  return 'داده اصلی';
}
/* باز کردن بالای کارت‌های مشتق‌شده (سهامداران/هیئت‌مدیره/نیروی انسانی) برای ویرایش فیلد مأخذ */
function visualEditableChip(p, key){
  var f = p.fields[key];
  if (!f) return '';
  var state = computeFieldState(f, p);
  return '<span class="pill source AI_SUGGESTED" style="gap:6px;cursor:pointer;font-weight:600;" '+
    'onclick="event.stopPropagation();openFieldState(\''+p.id+'\',\''+key+'\')" title="مشاهده و ویرایش '+esc(f.label)+'">'+
    fieldStateDot(state, p.id, key)+'ویرایش</span>';
}
function fieldStateDot(state, pid, key){
  if (state.status==='original') return '';
  var cls = state.status==='conflict' ? 'red' : 'blue';
  return '<span class="data-state-dot '+cls+'" title="'+fieldStateLabel(state)+'" style="display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;cursor:pointer;" onclick="event.stopPropagation();openFieldState(\''+pid+'\',\''+key+'\')"></span> ';
}

  if (!f) return null;

/* چیپ خلاصه یک فیلد با نشانگر وضعیت (برای نمای کلی) */
function buildFieldSummaryChip(p, key){
  var f = p.fields[key];
  if (!f) return '';
  var state = computeFieldState(f, p);
  var resolved = state.resolved;
  var valText = resolved ? (f.dataType==='NUMBER' ? fmtNum(resolved.value, 2) : esc(resolved.value)) : '—';
  return '<span class="pill source DOCUMENT_OCR" style="gap:6px;cursor:pointer;" onclick="event.stopPropagation();openFieldState(\''+p.id+'\',\''+key+'\')" title="مشاهده منابع و تاریخچه">'+fieldStateDot(state, p.id, key)+
    '<span style="font-weight:600;">'+esc(f.label)+':</span> '+numSpan(valText)+'</span>';
}
function fieldVal(project, key){
  var f = project.fields[key];
  if (!f) return null;
  var id = resolveFieldId(f, project);
  var v = f.values.filter(function(x){ return x.id===id; })[0];
  return v ? v.value : null;
}
function actualCashFlows(p){
  return [1,2,3,4,5].map(function(y){
    var actual = fieldVal(p, 'feasibilityActuals.cashFlowYear'+y);
    return actual!=null ? actual : fieldVal(p, 'feasibility.cashFlowYear'+y);
  });
}
function hasAnyActualData(p){
  return [1,2,3,4,5].some(function(y){ return fieldVal(p,'feasibilityActuals.cashFlowYear'+y)!=null; });
}
function movePriority(pid, source, dir){
  var p = DB.projects[pid];
  var order = (p.sourcePriorityOverride || SOURCE_PRIORITY).slice();
  var i = order.indexOf(source), j = i+dir;
  if (j<0 || j>=order.length) return;
  if (!confirm('تغییر اولویت مأخذ ممکن است مقدار نهایی برخی فیلدهای این پروژه (در جاهایی که مقدار پین‌شده ندارند) را تغییر دهد یا جایگزین کند. ادامه می‌دهید؟')) return;
  var tmp = order[i]; order[i]=order[j]; order[j]=tmp;
  p.sourcePriorityOverride = order;
  recomputeKpis(p);
  render();
}
function resetPriority(pid){
  if (!confirm('بازگشت به ترتیب پیش‌فرض سامانه ممکن است مقدار نهایی برخی فیلدهای این پروژه را تغییر دهد. ادامه می‌دهید؟')) return;
  DB.projects[pid].sourcePriorityOverride = null;
  recomputeKpis(DB.projects[pid]);

function recomputeKpis(project){
  Object.keys(KPI_DEFS).forEach(function(key){
    var def = KPI_DEFS[key];
    if (def.appliesTo.indexOf(project.type)===-1) return;
    var newVal = def.compute(project);
    var prev = project.kpiState[key] ? project.kpiState[key].value : null;
    var trend = 'UNKNOWN';
    if (newVal!=null && prev!=null){ trend = newVal>prev ? 'UP' : (newVal<prev ? 'DOWN' : 'FLAT'); }
    project.kpiState[key] = { value:newVal, trend:trend, format:def.format, label:def.label, prev:prev };
  });
  computeHealth(project);
}
function computeHealth(project){
  var score = null;
  if (project.type==='BUSINESS_ANALYSIS'){
    var m = project.kpiState.net_profit_margin ? project.kpiState.net_profit_margin.value : null;
    var cr = project.kpiState.current_ratio ? project.kpiState.current_ratio.value : null;
    if (m!=null && cr!=null) score = Math.round(Math.min(99, Math.max(5, m*2.5 + cr*20)));
  } else if (project.type==='FEASIBILITY_STUDY'){
    var irr = project.kpiState.irr ? project.kpiState.irr.value : null;
    if (irr!=null) score = Math.round(Math.min(99, Math.max(5, 45 + irr*1.3)));
  } else if (project.type==='VALUATION_REPORT'){
    var eq = project.kpiState.equity_value ? project.kpiState.equity_value.value : null;
    if (eq!=null) score = eq>0 ? 78 : 25;
  }
  project.health = score;
  project.healthStatus = score==null ? 'unknown' : (score>=70?'ok':(score>=45?'warn':'risk'));
}
function sealClass(status){ return status==='risk'?' risk':(status==='warn'?' gold':''); }
function sealHTML(score, status, sizeCls){
  var ring = (score!=null) ? '<svg class="seal-ring" viewBox="0 0 36 36"><path class="ring-bg" d="M18 2.5a15.5 15.5 0 010 31 15.5 15.5 0 010-31"/><path class="ring-fg" stroke-dasharray="'+Math.max(2,score)+', 100" d="M18 2.5a15.5 15.5 0 010 31 15.5 15.5 0 010-31"/></svg>' : '';
  return '<div class="seal '+sizeCls+sealClass(status)+'">'+ring+'<span class="v">'+(score==null?'—':score)+'</span></div>';
}
function sparkline(prev, curr){
  if (prev==null || curr==null || prev===curr) return '';
  var lo = Math.min(prev,curr), hi = Math.max(prev,curr), span = (hi-lo)||1;
  function y(v){ return 15 - ((v-lo)/span)*12; }
  var y1=y(prev).toFixed(1), y2=y(curr).toFixed(1);
  return '<svg class="kpi-spark" width="30" height="18" viewBox="0 0 30 18"><polyline points="2,'+y1+' 28,'+y2+'"/><circle cx="28" cy="'+y2+'" r="2"/></svg>';
}

function resolvedValueInfo(p, key){
  var f = p.fields[key];
  if (!f) return null;
  var id = resolveFieldId(f, p);
  return f.values.filter(function(v){ return v.id===id; })[0] || null;
}
function lowConfidenceNote(p, fieldKeys){
  var flagged = fieldKeys.filter(function(k){
    var v = resolvedValueInfo(p,k);
    return v && v.source==='DOCUMENT_OCR' && v.confidence!=null && v.confidence<0.75;
  });
  if (!flagged.length) return '';
  var labels = flagged.map(function(k){ return p.fields[k].label; }).join('، ');
  return ' (مقدار «'+labels+'» با اطمینان پایین از OCR استخراج شده و می‌تواند ریشه این ناسازگاری باشد.)';
}
var CROSS_CHECK_RULES = {
  BUSINESS_ANALYSIS: [
    { fields:['financials.totalAssets','financials.totalLiabilities','financials.totalEquity'], severity:'risk',
      test:function(p){ var a=fieldVal(p,'financials.totalAssets'), l=fieldVal(p,'financials.totalLiabilities'), e=fieldVal(p,'financials.totalEquity');
        if (a==null||l==null||e==null) return true; return Math.abs(a-(l+e)) <= Math.max(a,1)*0.05; },
      message:'کل دارایی‌ها با مجموع بدهی‌ها و حقوق صاحبان سهام هم‌خوانی ندارد (اتحاد ترازنامه برقرار نیست).' },
    { fields:['financials.netProfit','financials.grossProfit'], severity:'warn',
      test:function(p){ var n=fieldVal(p,'financials.netProfit'), g=fieldVal(p,'financials.grossProfit'); if (n==null||g==null) return true; return n<=g; },

      message:'سرمایه‌گذاری اولیه صفر یا منفی ثبت شده است.' }
  ],

      message:'نرخ تنزیل (WACC) خارج از بازه معمول (بین صفر تا ۶۰ درصد) است.' },
    { fields:['valuation.terminalGrowthRate','valuation.discountRate'], severity:'risk',

      message:'نرخ رشد پایدار باید کمتر از نرخ تنزیل باشد؛ در غیر این صورت ارزش شرکت قابل محاسبه نیست.' },

function runCrossChecks(p){
  var rules = CROSS_CHECK_RULES[p.type] || [];
  var out = [];
  rules.forEach(function(r){
    if (!r.test(p)) out.push({ severity:r.severity, message:r.message + lowConfidenceNote(p, r.fields), fields:r.fields });
  });
  return out;
}
function buildCrossCheckCard(p){
  var findings = runCrossChecks(p);
  if (!findings.length){
    return '<div class="card card-pad" style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">'+
      '<span class="pill ok" style="flex:none;">بدون ناسازگاری</span>'+
      '<div style="flex:1;font-size:11.5px;color:var(--ink-muted);">بررسی هوشمند سازگاری داده‌ها (مانند اتحاد ترازنامه و روابط منطقی بین فیلدها) برای این پروژه موردی پیدا نکرد.</div>'+
    '</div>';
  }
  var rows = findings.map(function(f){
    return '<div class="value-item"><span class="pill '+(f.severity==='risk'?'conflict':'warn')+'">'+(f.severity==='risk'?'بحرانی':'قابل بررسی')+'</span>'+
      '<span class="v" style="flex:1;">'+esc(f.message)+'</span></div>';
  }).join('');
  return '<div class="card card-pad" style="margin-bottom:18px;">'+
    '<div class="section-head" style="margin:0 0 10px;"><h3>بررسی هوشمند سازگاری داده‌ها</h3><span class="hint">'+findings.length+' مورد نیازمند بررسی</span></div>'+
    '<div class="value-list">'+rows+'</div>'+
  '</div>';
}

function tocKeysForNewProject(type){
  var defName = DB.defaultTocTemplates && DB.defaultTocTemplates[type];
  if (defName){
    var t = DB.tocTemplates.filter(function(x){ return x.serviceType===type && x.name===defName; })[0];
    if (t) return t.pageKeys.slice();
  }
  return TOC_CATALOG_BY_TYPE[type].slice();
}
function openTocEditor(pid){
  var p = DB.projects[pid];
  var all = TOC_CATALOG_BY_TYPE[p.type].slice();
  var order = p.report.pageKeys.slice();
  all.forEach(function(k){ if (order.indexOf(k)===-1) order.push(k); });
  var included = {};
  order.forEach(function(k){ included[k] = p.report.pageKeys.indexOf(k)!==-1; });
  UI.tocDraft = { projectId:pid, order:order, included:included, dragKey:null };
  render();
}
function closeTocEditor(){ UI.tocDraft = null; render(); }
function toggleTocItem(key){ UI.tocDraft.included[key] = !UI.tocDraft.included[key]; render(); }
function moveTocItem(key, dir){
  var d = UI.tocDraft, i = d.order.indexOf(key), j = i+dir;
  if (j<0 || j>=d.order.length) return;
  var tmp = d.order[i]; d.order[i]=d.order[j]; d.order[j]=tmp;
  render();
}
function tocDragStart(key){ UI.tocDraft.dragKey = key; }
function tocDropOn(targetKey){
  var d = UI.tocDraft, from = d.dragKey;
  d.dragKey = null;
  if (!from || from===targetKey) return;
  var order = d.order.filter(function(k){ return k!==from; });
  var idx = order.indexOf(targetKey);
  order.splice(idx, 0, from);
  d.order = order;
  render();
}
function applyTocEditor(){
  var d = UI.tocDraft, p = DB.projects[d.projectId];
  var newKeys = d.order.filter(function(k){ return d.included[k]; });
  p.report.pageKeys = newKeys;
  newKeys.forEach(function(pk){ if (!p.pages[pk]) generatePage(p, pk, personName('pm')); });
  UI.tocDraft = null;
  render();
}
function saveTocTemplate(){
  var name = prompt('نام الگوی شخصی برای این فهرست و ترتیب:');
  if (!name) return;
  var d = UI.tocDraft, p = DB.projects[d.projectId];
  DB.tocTemplates.push({ name:name, serviceType:p.type, pageKeys: d.order.filter(function(k){ return d.included[k]; }) });
  render();
}
function loadTocTemplate(idx){
  var t = DB.tocTemplates[idx], d = UI.tocDraft;
  d.order = t.pageKeys.concat(d.order.filter(function(k){ return t.pageKeys.indexOf(k)===-1; }));
  Object.keys(d.included).forEach(function(k){ d.included[k] = t.pageKeys.indexOf(k)!==-1; });
  render();
}
function setDefaultTocTemplate(serviceType, name){
  if (!confirm('فهرست «'+name+'» به‌عنوان فهرست مبنای پیش‌فرض همه پروژه‌های جدید از نوع «'+typeLabel(serviceType)+'» تنظیم شود؟')) return;
  DB.defaultTocTemplates[serviceType] = name;
  render();
}
function clearDefaultTocTemplate(serviceType){
  DB.defaultTocTemplates[serviceType] = null;
  render();
}
function buildTocEditor(p){
  var d = UI.tocDraft;
  var rows = d.order.map(function(key, i){
    var def = PAGE_DEFS[key];
    return '<div class="value-item" draggable="true" ondragstart="tocDragStart(\''+key+'\')" ondragover="event.preventDefault()" ondrop="tocDropOn(\''+key+'\')" style="cursor:grab;">' +
      '<span class="drag-handle" title="جابه‌جایی با کشیدن" style="flex:none;color:var(--ink-faint);cursor:grab;">⠿⠿</span>'+
      '<input type="checkbox" '+(d.included[key]?'checked':'')+' onchange="toggleTocItem(\''+key+'\')" title="نمایش/عدم نمایش در گزارش"/>' +
      '<span class="v" style="flex:1;font-weight:600;">'+esc(def.title)+'</span>' +
      '<span class="pill muted">'+(def.type==='AI'?'AI':'استاتیک')+'</span>' +
      '<button class="btn small ghost" onclick="moveTocItem(\''+key+'\',-1)" '+(i===0?'disabled':'')+' title="بالاتر">▲</button>' +
      '<button class="btn small ghost" onclick="moveTocItem(\''+key+'\',1)" '+(i===d.order.length-1?'disabled':'')+' title="پایین‌تر">▼</button>' +
    '</div>';
  }).join('');
  var templates = DB.tocTemplates.filter(function(t){ return t.serviceType===p.type; });
  var defaultName = DB.defaultTocTemplates && DB.defaultTocTemplates[p.type];
  var tplRow = templates.length ? ('<div class="value-list" style="margin-top:10px;">'+
    templates.map(function(t,i){
      var isDefault = defaultName===t.name;
      return '<div class="value-item"><span class="v" style="flex:1;">'+esc(t.name)+(isDefault?' <span class="pill ok">فهرست مبنا</span>':'')+'</span>'+
        '<button class="btn small ghost" onclick="loadTocTemplate('+DB.tocTemplates.indexOf(t)+')">اعمال روی این گزارش</button>'+
        (isDefault ? '<button class="btn small ghost" onclick="clearDefaultTocTemplate(\''+p.type+'\')">حذف از فهرست مبنا</button>' : '<button class="btn small ghost" onclick="setDefaultTocTemplate(\''+p.type+'\',\''+esc(t.name)+'\')">تعیین به‌عنوان مبنا</button>')+
      '</div>';
    }).join('') +
  '</div>') : '';
  return '<div class="card card-pad no-print" style="margin-bottom:18px;">' +
    '<div class="section-head" style="margin:0 0 10px;"><h3>تعیین فهرست و ترتیب گزارش</h3><span class="hint">صفحات را با تیک‌زدن نمایش/پنهان کنید و با کشیدن (drag) یا فلش‌ها ترتیب را تغییر دهید</span></div>' +
    '<div class="value-list">'+rows+'</div>' +
    (templates.length ? '<div style="font-size:11.5px;color:var(--ink-muted);margin-top:14px;">الگوهای ذخیره‌شده برای «'+typeLabel(p.type)+'» — «فهرست مبنا» به‌طور خودکار روی پروژه‌های جدید این نوع اعمال می‌شود</div>' : '') + tplRow +

function generatePage(project, pageKey, editorName){

  var def =
    PAGE_DEFS[pageKey];


  if(!def){

    console.error(
      'Missing PAGE_DEFS definition:',
      pageKey,
      'project:',
      project ? project.id : 'unknown'
    );

    return null;

  }


  var blocks = [];


  if(
    typeof def.buildBlocks === 'function'
  ){

    blocks =
      def.buildBlocks(project) || [];

  }


  /*
    صفحات Static معمولی
  */
  else if(
    def.type === 'STATIC'
  ){

    var rows = [];


    Object.keys(
      def.fields || {}
    ).forEach(function(label){

      var key =
        def.fields[label];

      var v =
        fieldVal(
          project,
          key
        );


      rows.push({

        label:label,

        value:
          (
            v!=null &&
            isPercentLikeField(key)
          )
            ?
            {
              __pct:v
            }
            :
            v

      });

    });


    Object.keys(
      def.kpis || {}
    ).forEach(function(label){

      var kpiKey =
        def.kpis[label];

      var st =
        project.kpiState[kpiKey];


      rows.push({

        label:label,

        value:
          st
            ?
            {
              __kpi:kpiKey,
              __val:st.value,
              __fmt:st.format
            }
            :
            null

      });

    });


    if(
      rows.length
    ){

      blocks.push({

        id:uid(),

        type:'table',

        width:'full',

        rows:rows

      });

    }


    if(
      def.chartFields
    ){

      var items =
        def.chartFields.items.map(
          function(it){

            return {

              label:it.label,

              value:
                fieldVal(
                  project,
                  it.key
                ),

              format:'CURRENCY'

            };

          }
        );


      blocks.push({

        id:uid(),

        type:'chart',

        width:'full',

        title:
          def.chartFields.title,

        items:items

      });

    }

  }


  /*
    صفحات AI معمولی
  */
  else{

    blocks.push({

      id:uid(),

      type:'text',

      width:'full',

      text:
        '[خروجی آزمایشی هوش مصنوعی — جایگزین با اتصال واقعی]\n\n'+
        def.prompt(project)

    });

  }


  var page =
    project.pages[pageKey];


  if(
    !page
  ){

    page = {

      title:def.title,

      type:def.type,

      versions:[],

      currentIndex:-1

    };


    project.pages[pageKey] =
      page;

  }


  page.versions.push({

    content:{
      blocks:blocks
    },

    editor:editorName,

    at:new Date()

  });


  page.currentIndex =
    page.versions.length-1;


  return page;

}
function editPageContent(project, pageKey, newContent, editorName){
  var page = project.pages[pageKey];
  page.versions.push({ content:newContent, editor:editorName, at:new Date() });
  page.currentIndex = page.versions.length-1;
}
function currentPageContent(page){ return page.versions[page.currentIndex].content; }
function blockIndex(blocks, blockId){
  for (var i=0;i<blocks.length;i++){ if (blocks[i].id===blockId) return i; }
  return -1;
}
function findBlock(project, pageKey, blockId){
  var blocks = currentPageContent(project.pages[pageKey]).blocks;
  return blocks[blockIndex(blocks, blockId)];
}
function setBlockWidth(pid, pageKey, blockId, width){
  var b = findBlock(DB.projects[pid], pageKey, blockId);
  if (b) b.width = width;
  render();
}
function moveBlock(pid, pageKey, blockId, dir){
  var blocks = currentPageContent(DB.projects[pid].pages[pageKey]).blocks;
  var i = blockIndex(blocks, blockId), j = i+dir;
  if (i===-1 || j<0 || j>=blocks.length) return;
  var tmp = blocks[i]; blocks[i]=blocks[j]; blocks[j]=tmp;
  render();
}
function removeBlock(pid, pageKey, blockId){
  if (!confirm('این بلوک از صفحه حذف شود؟')) return;
  var content = currentPageContent(DB.projects[pid].pages[pageKey]);
  content.blocks = content.blocks.filter(function(b){ return b.id!==blockId; });
  render();
}
function addTextBlock(pid, pageKey){
  var content = currentPageContent(DB.projects[pid].pages[pageKey]);
  content.blocks.push({ id:uid(), type:'text', width:'full', text:'' });
  UI.editingPage = pageKey;
  render();
}
function handleAddImageBlock(pid, pageKey, input){
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var content = currentPageContent(DB.projects[pid].pages[pageKey]);
    content.blocks.push({ id:uid(), type:'image', width:'half', dataUrl:e.target.result, caption:file.name });
    render();
  };
  reader.readAsDataURL(file);
}
function saveBlockEdits(pid, pageKey){
  var p = DB.projects[pid];
  var content = currentPageContent(p.pages[pageKey]);
  var newBlocks = content.blocks.map(function(b){
    if (b.type!=='text' && b.type!=='table') return b;
    var ta = document.getElementById('blk-'+b.id);
    if (!ta) return b;
    if (b.type==='text') return Object.assign({}, b, { text: ta.value });
    var rows = ta.value.split('\n').map(function(line){
      var idx = line.indexOf(':');
      if (idx===-1) return null;
      var label = line.slice(0,idx).trim(), rest = line.slice(idx+1).trim();
      var num = parseFloat(rest.replace(/,/g,''));
      var value = (rest!=='' && !isNaN(num) && String(num)===rest.replace(/,/g,'')) ? num : rest;
      return { label:label, value:value };
    }).filter(function(r){ return r; });
    return Object.assign({}, b, { rows:rows });
  });
  editPageContent(p, pageKey, { blocks:newBlocks }, personName('pm'));
  UI.editingPage = null;
  render();
}

function fmtNum(n, digits){
  if (n==null || isNaN(n)) return '—';
  return new Intl.NumberFormat('en-US',{ maximumFractionDigits: digits==null?0:digits }).format(n);
}
function fmtCurrency(n){ if (n==null) return '—'; return fmtNum(n) + ' ریال'; }
function fmtPercent(n){ if (n==null) return '—'; return n.toFixed(1) + '%'; }
function fmtRatio(n){ if (n==null) return '—'; return n.toFixed(2); }
function fmtByFormat(n, format){
  if (format==='CURRENCY') return fmtCurrency(n);
  if (format==='PERCENT') return fmtPercent(n);
  if (format==='RATIO') return fmtRatio(n);
  return fmtNum(n, 2);
}
function numSpan(text){ return '<span class="num">'+text+'</span>'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var FA_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function faNum(text){ return String(text).replace(/[0-9]/g, function(d){ return FA_DIGITS[d]; }); }
var EN_DIGITS = {'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9','٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
function enNum(text){ return String(text).replace(/[۰-۹٠-٩]/g, function(d){ return EN_DIGITS[d]; }); }
function localizeHtml(html){ return html.replace(/>([^<]*)</g, function(m, text){ return '>' + faNum(text) + '<'; }); }
function fmtDate(d){ if(!d) return ''; var dt=(d instanceof Date)?d:new Date(d); return dt.toLocaleDateString('en-CA'); }
function typeLabel(t){ return t==='BUSINESS_ANALYSIS'?'تحلیل کسب‌وکار':(t==='FEASIBILITY_STUDY'?'امکان‌سنجی':'ارزش‌گذاری'); }

/* ---- عملیات: پرسشنامه ---- */
function aiSuggestValues(type, base){
  base = base || {};
  var out = {};
  if (type==='FEASIBILITY_STUDY'){
    var scaleMap = { 'کوچک':2000000000, 'متوسط':8000000000, 'بزرگ':25000000000 };
    if (base.sector) out['meta.industrySector'] = base.sector;
    if (base.scale){
      var invest = scaleMap[base.scale] || 5000000000;
      out['feasibility.initialInvestment'] = invest;
      out['feasibility.discountRate'] = 0.18;
      for (var y=1;y<=5;y++) out['feasibility.cashFlowYear'+y] = Math.round(invest*0.32*(0.85+y*0.05));
    }
  } else if (type==='VALUATION_REPORT'){
    if (base.method){
      out['valuation.discountRate'] = 0.2;
      out['valuation.terminalGrowthRate'] = 0.03;
    }
  }
  return out;
}
function aiFilledKeysExist(p){
  return Object.keys(p.fields).some(function(k){ return p.fields[k].values.some(function(v){ return v.source==='AI_SUGGESTED'; }); });
}
function aiFillDetailQuestionnaire(pid){
  var p = DB.projects[pid];
  var suggestions = aiSuggestValues(p.type, (p.questionnaire||{}).base);
  var filled = 0;
  Object.keys(suggestions).forEach(function(key){
    var f = p.fields[key];
    if (!f) return;
    var hasReal = f.values.some(function(v){ return v.source!=='AI_SUGGESTED'; });
    if (hasReal) return;
    f.values = f.values.filter(function(v){ return v.source!=='AI_SUGGESTED'; });
    f.values.push({ id:uid(), source:'AI_SUGGESTED', value:suggestions[key], at:new Date() });
    filled++;
  });
  recomputeKpis(p);
  render();
  return filled;
}
function runAiFill(pid){
  var n = aiFillDetailQuestionnaire(pid);
  alert(n>0 ? ('تعداد '+n+' فیلد از پرسشنامه تفصیلی با پیشنهاد هوش مصنوعی تکمیل شد.') : 'فیلد خالی جدیدی برای تکمیل هوشمند یافت نشد، یا پاسخ‌های پایه کافی برای ارائه پیشنهاد وجود ندارد.');
}
function setBaseAnswer(pid, key, value){
  var p = DB.projects[pid];
  p.questionnaire = p.questionnaire || { base:{} };
  var changed = p.questionnaire.base[key] !== value;
  p.questionnaire.base[key] = value;
  if (changed && aiFilledKeysExist(p)){
    if (confirm('تغییر این پاسخ باعث می‌شود پرسشنامه تفصیلی که به‌صورت هوشمند از روی پاسخ‌های پایه ساخته شده، به‌روزرسانی خودکار شود. آیا ادامه می‌دهید؟')){
      aiFillDetailQuestionnaire(pid);
      return;
    }
  }
  render();
}

function submitFieldValue(pid, fieldKey, raw){

  var p = DB.projects[pid];

  if (raw==null || String(raw).trim()==='') return;

  var dataType = p.fields[fieldKey].dataType;

  var normalized = String(raw).trim();

  if (dataType==='NUMBER'){
    normalized = enNum(normalized)
      .replace(/,/g,'')
      .replace(/٬/g,'')
      .trim();
  }

  var value =
    dataType==='NUMBER'
      ? parseFloat(normalized)
      : normalized;

  if (dataType==='NUMBER' && isNaN(value)){
    alert('لطفاً یک عدد معتبر وارد کنید.');
    return;
  }

  var v = {
    id:uid(),
    source:'MANUAL_ENTRY',
    value:value,
    at:new Date()
  };

  p.fields[fieldKey].values.push(v);

  /*
    ورود دستی کاربر یعنی کاربر عمداً این مقدار
    را به عنوان مقدار نهایی انتخاب کرده است.
  */
  p.fields[fieldKey].pinnedId = v.id;

  recomputeKpis(p);

  UI.expandedField = null;
  render();
}

function submitQFieldValue(pid, fieldKey, inputId){
  var input = document.getElementById(inputId);
  if (!input) return;
  var raw = input.value.trim();
  if (raw===''){ render(); return; }
  if (!confirm('این فیلد ممکن است در محاسبه سایر شاخص‌ها و بخش‌های گزارش نیز استفاده شود. تغییر مقدار آن می‌تواند بر نتایج مرتبط تأثیر بگذارد. آیا ادامه می‌دهید؟')){ render(); return; }
  submitFieldValue(pid, fieldKey, raw);
}

/* ---- عملیات: برنامه عملیاتی ---- */
function findPlanNode(nodes, id){
  for (var i=0;i<nodes.length;i++){
    if (nodes[i].id===id) return nodes[i];
    var found = findPlanNode(nodes[i].children, id);
    if (found) return found;
  }
  return null;
}
function updateProgress(pid, nodeId, value){
  var p = DB.projects[pid];
  var node = findPlanNode(p.plan, nodeId);
  if (node) node.progress = parseInt(value,10);
  render();
}
function addPlanAction(pid, parentId){
  var title = prompt('عنوان اقدام'+(parentId?' فرعی':'')+' جدید:');
  if (!title) return;
  var description = prompt('شرح اقدام (اختیاری):') || '';
  var dueDate = prompt('زمان‌بندی (اختیاری — مثال: ۱۴۰۵/۰۶/۳۰):') || '';
  var node = { id:uid(), title:title, description:description, dueDate:dueDate, progress:0, assignee:'pm', attachments:[], children:[] };
  var p = DB.projects[pid];
  if (parentId){
    var parent = findPlanNode(p.plan, parentId);
    parent.children.push(node);
  } else {
    p.plan = p.plan || [];
    p.plan.push(node);
  }
  render();
}
function addPlanAttachment(pid, nodeId){
  var name = prompt('نام فایل پیوست:');
  if (!name) return;
  var node = findPlanNode(DB.projects[pid].plan, nodeId);
  node.attachments = node.attachments || [];
  node.attachments.push(name);
  render();
}

function maskContact(contact, method){
  if (method==='SMS_OTP'){
    return contact.length>4 ? contact.slice(0,3)+'***'+contact.slice(-2) : contact;
  }
  var parts = contact.split('@');
  if (parts.length!==2) return contact;
  var maskedUser = parts[0].length>2 ? parts[0].slice(0,2)+'***' : parts[0]+'***';
  return maskedUser+'@'+parts[1];
}

  ep.stage = 'report';
  render();
}

function heatStatus(project, key){
  var st = project.kpiState[key]; if (!st || st.value==null) return null;
  var v = st.value;
  switch(key){
    case 'revenue_growth': return v<0?'risk':(v<10?'warn':'ok');
    case 'net_profit_margin': return v<5?'risk':(v<15?'warn':'ok');
    case 'gross_profit_margin': return v<15?'risk':(v<30?'warn':'ok');
    case 'operating_margin': return v<5?'risk':(v<15?'warn':'ok');
    case 'current_ratio': return v<1?'risk':(v<1.5?'warn':'ok');
    case 'quick_ratio': return v<0.7?'risk':(v<1?'warn':'ok');
    case 'working_capital': return v<0?'risk':'ok';
    case 'debt_to_equity': return v>2?'risk':(v>1?'warn':'ok');
    case 'debt_ratio': return v>70?'risk':(v>50?'warn':'ok');
    case 'roe': return v<10?'risk':(v<20?'warn':'ok');
    case 'roa': return v<5?'risk':(v<10?'warn':'ok');
    case 'asset_turnover': return v<0.5?'risk':(v<1?'warn':'ok');
    case 'npv': return v<0?'risk':'ok';
    case 'irr':
      var dr = fieldVal(project,'feasibility.discountRate');
      if (dr==null) return v<0?'risk':'ok';
      return v < dr*100 ? 'risk' : (v < dr*100+5 ? 'warn' : 'ok');
    case 'payback_period': return v>4?'risk':(v>2.5?'warn':'ok');
    case 'benefit_cost_ratio': return v<1?'risk':(v<1.2?'warn':'ok');
    case 'actual_irr':
      var dr2 = fieldVal(project,'feasibility.discountRate');
      if (dr2==null) return v<0?'risk':'ok';
      return v < dr2*100 ? 'risk' : (v < dr2*100+5 ? 'warn' : 'ok');
    case 'actual_npv': return v<0?'risk':'ok';
    case 'performance_variance': return v<-5?'risk':(v<0?'warn':'ok');
    case 'enterprise_value': case 'equity_value': case 'value_per_share': return v<0?'risk':'ok';
    default: return null;
  }
}
function heatLabel(status){ return status==='ok'?'مطلوب':(status==='warn'?'قابل‌توجه':'بحرانی'); }

function trendWord(t){ return t==='UP'?'رشد':(t==='DOWN'?'کاهش':(t==='FLAT'?'بدون تغییر':'بدون مقدار قبلی')); }

function buildKpiCard(p, k){
  var st = p.kpiState[k], def = KPI_DEFS[k];
  var cls = st.trend==='UP'?'up':(st.trend==='DOWN'?'down':(st.trend==='FLAT'?'flat':'unknown'));

  var imp = KPI_IMPORTANCE[def && def.importance] || KPI_IMPORTANCE.medium;
  return '<div class="card kpi-card" tabindex="0" role="button" aria-label="'+esc(st.label)+'" onclick="openKpiDetail(\''+p.id+'\',\''+k+'\')" onkeydown="if(event.key===\'Enter\')openKpiDetail(\''+p.id+'\',\''+k+'\')">'+

      '<span class="kpi-importance" style="color:'+imp.color+';"><span class="dot" style="background:'+imp.color+';"></span>'+imp.label+'</span></div>'+
    '<span class="kpi-value">'+numSpan(esc(fmtByFormat(st.value, st.format)))+'</span>'+
    '<span class="kpi-trend '+cls+'" style="display:inline-flex;align-items:center;gap:6px;">'+trendArrow(st.trend)+' '+trendWord(st.trend)+sparkline(st.prev, st.value)+'</span>'+
  '</div>';
}

function buildKpiSection(p){
  var byCat = {};
  Object.keys(p.kpiState).forEach(function(k){
    var cat = (KPI_DEFS[k] && KPI_DEFS[k].category) || 'other';
    byCat[cat] = byCat[cat] || [];
    byCat[cat].push(k);
  });
  var order = Object.keys(KPI_CATEGORIES).filter(function(c){ return byCat[c] && byCat[c].length; });
  Object.keys(byCat).forEach(function(c){ if (order.indexOf(c)===-1) order.push(c); });
  if (!order.length) return '<p class="empty">شاخصی برای این نوع پروژه تعریف نشده است.</p>';
  return order.map(function(cat){
    var meta = KPI_CATEGORIES[cat] || { label:'سایر شاخص‌ها', letter:'—', cls:'ba' };
    var keys = byCat[cat];
    return '<div class="kpi-cat-head"><span class="cat-badge '+meta.cls+'">'+meta.letter+'</span><h4>'+esc(meta.label)+'</h4><span class="cnt">'+keys.length+' شاخص</span></div>'+

}

function buildKpiTrackSummary(p){
  var keys = Object.keys(p.kpiState).filter(function(k){ return heatStatus(p,k)!=null; });
  if (!keys.length) return '';
  var counts = { ok:0, warn:0, risk:0 };
  keys.forEach(function(k){ counts[heatStatus(p,k)]++; });
  var total = keys.length, pct = Math.round(counts.ok/total*100);
  var status = pct>=70?'ok':(pct>=40?'warn':'risk');
  return '<div class="card card-pad kpi-track">'+
    sealHTML(pct, status, 'lg')+
    '<div style="flex:1;min-width:180px;">'+
      '<div style="font-weight:700;font-size:13.5px;">شاخص‌ها در مسیر مطلوب</div>'+

      '<div class="kpi-track-legend">'+
        '<span style="color:var(--positive);"><span class="dot" style="background:var(--accent);"></span>'+counts.ok+' مطلوب</span>'+
        '<span style="color:var(--gold);"><span class="dot" style="background:var(--gold);"></span>'+counts.warn+' قابل‌توجه</span>'+
        '<span style="color:var(--risk);"><span class="dot" style="background:var(--risk);"></span>'+counts.risk+' بحرانی</span>'+

    '</div>'+
  '</div>';
}

function baNewsImpactLabel(impact){

  if(impact==='positive'){
    return 'اثر مثبت';

  if(impact==='negative'){
    return 'اثر منفی';
  }

  return 'اثر خنثی / نامشخص';

}


function baNewsImpactClass(impact){

  if(impact==='positive'){
    return 'positive';
  }

  if(impact==='negative'){
    return 'negative';
  }

  return 'neutral';

}


function baNewsIntensityLabel(value){

  return 'کم';

function getBAFilteredNews(){

  var query =
    String(
      BA_NEWS_UI.query || ''
    )
    .trim()
    .toLowerCase();


  return BA_NEWS_DEMO.filter(
    function(item){


      if(
        BA_NEWS_UI.category!=='all' &&
        item.category!==
        BA_NEWS_UI.category
      ){
        return false;
      }


      if(
        BA_NEWS_UI.impact!=='all' &&
        item.impact!==
        BA_NEWS_UI.impact
      ){
        return false;
      }


      if(query){

        var text =
          (
            item.title+' '+
            item.summary+' '+
            item.source
          )
          .toLowerCase();


        if(
          text.indexOf(query)===-1
        ){
          return false;
        }

      }


      return true;

    }
  );

}

function askBANewsAI(){

  var input =
    document.getElementById(
      'ba-news-question'
    );


  if(!input){
    return;
  }


  var question =
    input.value.trim();


  if(!question){
    return;
  }


  BA_NEWS_CHAT.push({

    role:'user',

    text:question

  });



  var mostRelevant =
    BA_NEWS_DEMO
    .slice()
    .sort(function(a,b){

      return (
        b.relevance -
        a.relevance
      );

    })[0];


  var negative =
    BA_NEWS_DEMO
    .filter(function(x){

      return x.impact==='negative';

    })
    .sort(function(a,b){

      return (
        b.relevance -
        a.relevance
      );

    })[0];


  var answer =

    'در پایش فعلی، خبر «'+
    mostRelevant.title+
    '» بیشترین ارتباط را با شرکت دارد. '+
    (
      negative
        ?
        'از منظر ریسک، خبر «'+
        negative.title+
        '» اهمیت بیشتری دارد. '+
        negative.ai
        :

function getBAValuationModel(p){

  var a =
    BA_VAL_UI.assumptions;


  var revenue =
    fieldVal(
      p,
      'financials.revenueCurrentYear'
    ) || 1200000000;


  var netProfit =
    fieldVal(
      p,
      'financials.netProfit'
    ) || 180000000;


  var equity =
    fieldVal(
      p,
      'financials.totalEquity'
    ) || 700000000;


  var growth =
    a.revenueGrowth / 100;


  var margin =
    a.operatingMargin / 100;


  var discount =
    a.discountRate / 100;


  var terminalGrowth =
    a.terminalGrowth / 100;


  var cashConversion =
    a.cashConversion / 100;



  /*
    Prototype only:
    این مدل فرمول نهایی ارزش‌گذاری نیست.
  */

  var flows = [];

  var projectedRevenue =
    revenue;


  for(
    var year=1;
    year<=5;
    year++
  ){

    projectedRevenue *=
      (1 + growth);


    var operatingProfit =
      projectedRevenue *
      margin;


    var freeCashFlow =
      operatingProfit *
      cashConversion;


    flows.push(
      Math.round(
        freeCashFlow
      )
    );

  }



  var ev =
    enterpriseValue(
      discount,
      flows,
      terminalGrowth
    );


  if(
    ev==null ||
    !isFinite(ev)
  ){

    ev =
      equity * 1.8;

  }



  /*
    فقط برای Prototype:
    بدهی خالص نمایشی
  */

  var netDebt =
    Math.max(
      0,
      (
        fieldVal(
          p,
          'financials.totalLiabilities'
        ) || 0
      ) * 0.30
    );


  var equityValue =
    Math.max(
      0,
      ev - netDebt
    );



  return {

    revenue:revenue,

    netProfit:netProfit,

    bookEquity:equity,

    flows:flows,

    enterpriseValue:
      Math.round(ev),

    equityValue:
      Math.round(equityValue),

    netDebt:
      Math.round(netDebt)

  };

}

  function calculateWith(

  ){

    BA_VAL_UI.assumptions =

    );

  }


  var bear =

function getBARiskSummary(p){

  var items =
    getBARiskItems(p);


  var average =
    items.reduce(
      function(sum,item){

        return sum + item.score;

      },
      0
    ) / items.length;


  average =
    Math.round(average);


  return {

    score:average,

    cls:baRiskClass(average),

    label:baRiskLabel(average),

    high:
      items.filter(
        function(x){
          return x.score>=65;
        }
      ).length,

    medium:
      items.filter(
        function(x){
          return x.score>=40 &&
                 x.score<65;
        }
      ).length,

    low:
      items.filter(
        function(x){
          return x.score<40;
        }
      ).length

  };

}

function buildBARiskMatrix(p){

  var items =
    getBARiskItems(p);


  var html = '';


  for(
    var impact=5;
    impact>=1;
    impact--
  ){

    for(
      var probability=1;
      probability<=5;
      probability++
    ){

      var score =
        impact *
        probability;


      var cls =
        score>=15
          ? 'high'
          :
          (
            score>=7
              ? 'medium'
              : 'low'
          );


      var risks =
        items.filter(
          function(item){

            return (
              item.impact===impact &&
              item.probability===probability
            );

          }
        );


      html +=

        '<div class="ba-risk-matrix-cell '+cls+'">'+

          risks.map(
            function(risk){

              return (
                '<span title="'+
                esc(risk.title)+
                '">'+
                esc(
                  risk.title.replace(
                    'ریسک ',
                    ''
                  )
                )+
                '</span>'
              );

            }
          ).join('')+

        '</div>';

    }

  }


  return (

    '<div class="card card-pad ba-risk-matrix-card">'+


      '<div class="profile-card-title">'+
        'ماتریس احتمال × اثر'+
      '</div>'+


      '<div class="ba-risk-matrix-wrap">'+


        '<div class="ba-risk-axis-y">'+
          'اثر'+
        '</div>'+


        '<div class="ba-risk-matrix">'+
          html+
        '</div>'+


        '<div class="ba-risk-axis-x">'+
          'احتمال'+
        '</div>'+


      '</div>'+


      '<div class="ba-risk-matrix-legend">'+

        '<span class="low">پایین</span>'+

        '<span class="medium">متوسط</span>'+

        '<span class="high">بالا</span>'+

      '</div>'+


    '</div>'

  );

}

function buildBARiskRecommendations(p){

  var items =

function getBARatioItemData(p,item){

  if(item.kpiKey){

      p.kpiState &&
      p.kpiState[item.kpiKey];


    var def =
      KPI_DEFS[item.kpiKey];


    if(state && def){

      return {

        label:state.label,

        value:
          fmtByFormat(
            state.value,
            state.format
          ),

        status:
          heatStatus(
            p,
            item.kpiKey
          ) || 'ok',

        formula:
          def.formulaText ||
          'فرمول در موتور شاخص تعریف شده است.',

        benchmark:
          item.benchmark ||
          'مقایسه با صنعت',

        ai:
          item.ai ||
          def.description,

        real:true

      };

    }

  return {

    label:item.label || 'شاخص',

    value:item.value || '—',

    benchmark:item.benchmark || '—',

}

function baFinRow(statement,label){
  var ds = (BA_FINANCIAL_DEMO[statement]||{}).rows || [];
  for (var i=0;i<ds.length;i++){ if (ds[i].label===label) return ds[i]; }
  return null;
}
function baFinVal(statement,label,i){
  var r = baFinRow(statement,label);
  if (!r || !r.values) return null;
  return r.values[i];
}
function baFinForecastVal(statement,label,i){
  var r = baFinRow(statement,label);
  if (!r || !r.forecast) return null;
  return r.forecast[i];
}

function formatBARatioValue(r, v){
  if (v==null) return '—';
  if (r.format==='PERCENT') return fmtPercent(v);
  if (r.format==='CURRENCY') return fmtCurrency(v);
  return fmtRatio(v);
}
function baRatioColorClass(r, v){
  if (v==null) return 'muted';
  return r.status(v);
}
function buildBARatioTrendChart(r, years, values){
  var pts = values.filter(function(v){ return v!=null; });
  if (pts.length<2) return '';
  var lo=Math.min.apply(null,pts), hi=Math.max.apply(null,pts), span=(hi-lo)||1;
  var n=years.length, w=360, h=120, pad=24;
  function X(i){ return pad + i*(w-2*pad)/(n-1); }
  function Y(v){ return h-pad - ((v-lo)/span)*(h-2*pad); }
  var line = years.map(function(_,i){ var v=values[i]; if(v==null) return null; return X(i).toFixed(1)+','+Y(v).toFixed(1); }).filter(Boolean).join(' ');
  var dots = years.map(function(yr,i){ var v=values[i]; if(v==null) return ''; return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.6" fill="currentColor"></circle>'; }).join('');
  return '<svg class="report-chart" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
    '<polyline points="'+line+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>'+dots+'</svg>';
}
function buildBARatioTrend(p, r, years, values){
  return '<div class="card card-pad" style="margin-top:14px;">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">'+
      '<div style="font-weight:700;font-size:13px;">'+esc(r.label)+' — روند سال‌ها</div>'+
      '<button class="btn small ghost" onclick="closeBARatioTrend()">بستن ◂</button>'+
    '</div>'+
    '<div style="color:var(--accent-deep);margin-top:10px;">'+buildBARatioTrendChart(r,years,values)+'</div>'+
    '<div style="font-size:11.5px;color:var(--ink-muted);margin-top:8px;">فرمول: '+esc(r.formula)+'</div>'+
    '<div style="font-size:12.5px;color:var(--ink);margin-top:10px;line-height:1.9;">'+esc(r.ai)+'</div>'+
  '</div>';
}
function openBARatioTrend(key){ UI.baRatioTrend = key; render(); }
function closeBARatioTrend(){ UI.baRatioTrend = null; render(); }

function buildBARatioTable(p){

  var years = (BA_FINANCIAL_DEMO.years||[]).slice();
  var detailKey = UI.baRatioTrend;
  var html = '';

  BA_RATIO_TABLE.categories.forEach(function(cat){
    var ratios = BA_RATIO_TABLE.ratios.filter(function(r){ return r.cat===cat; });
    if (!ratios.length) return;
    html += '<tr class="cmp-cat-row"><td colspan="'+(years.length+2)+'">'+esc(cat)+'</td></tr>';
    ratios.forEach(function(r){
      var values = years.map(function(_,i){ return r.compute(i); });
      var cells = values.map(function(v,i){
        var cls = baRatioColorClass(r,v);
        return '<td class="num-cell '+(r.key===detailKey?'ba-ratio-active':'')+'" style="color:var(--'+(cls==='ok'?'positive':(cls==='warn'?'gold':'negative'))+');">'+
          (v==null ? '—' : numSpan(esc(formatBARatioValue(r,v))))+'</td>';
      }).join('');
      html += '<tr style="cursor:pointer;" onclick="openBARatioTrend(\''+r.key+'\')" title="مشاهده روند">'+
        '<td style="font-weight:600;">'+esc(r.label)+'</td>'+cells+
        '<td style="text-align:left;color:var(--ink-faint);font-size:11px;">'+(r.key===detailKey?'▲':'روند ▼')+'</td>'+
      '</tr>';
      if (r.key===detailKey){
        html += '<tr><td colspan="'+(years.length+2)+'">'+buildBARatioTrend(p,r,years,values)+'</td></tr>';
      }
    });
  });

  var yearsHeader = years.map(function(y){ return '<th class="num-cell">'+esc(y)+'</th>'; }).join('');

  return '<div class="section-head"><div><h3>نسبت‌های مالی</h3>'+
    '<span class="hint">همه نسبت‌ها به ترتیب؛ کلیک روی هر نسبت → روند در سال‌های مختلف</span></div>'+
    '<span class="pill source AI_SUGGESTED">تحلیل مالی</span></div>'+
    '<div class="table-wrap"><table><thead><tr><th>نسبت</th>'+yearsHeader+'<th></th></tr></thead><tbody>'+html+'</tbody></table></div>';

function toggleBARatioSel(key){
  UI.baRatioSel[key] = !UI.baRatioSel[key];

function runBARatioAiAnalysis(){
  var sel = Object.keys(UI.baRatioSel).filter(function(k){ return UI.baRatioSel[k]; });
  if (!sel.length){ alert('حداقل یک نسبت را انتخاب کنید.'); return; }
  UI.baRatioAi = sel.map(function(k){
    var found = null;
    BA_RATIO_GROUPS2.forEach(function(g){ g.ratios.forEach(function(r){ if (r.key===k) found=r; }); });
    return found;
  }).filter(Boolean);
  render();
}

/* =========================================================
   ایجنت درون‌صفحه (به‌جای چت‌بات) — دو کار: «توضیح دقیق» و «اعمال تغییر»
   ========================================================= */
function setBAAgentMode(mode){
  UI.baAgentMode = mode;
  UI.baAgentOut = null;
  render();
}
function applyBAAssumption(key, value){
  var el = document.getElementById('agent-'+key);
  var v = el ? parseFloat(el.value) : NaN;
  if (isNaN(v)){ alert('عدد معتبر وارد کنید.'); return; }
  BA_FIN_UI.assumptions[key] = v;
  BA_FIN_UI.forecast = true;
  UI.baAgentOut = '✅ تغییر مفروضه «'+({inflation:'نرخ تورم',salesGrowth:'رشد فروش',productionGrowth:'رشد تولید'}[key]||key)+'» به '+v+' اعمال شد و پیش‌بینی به‌روز شد.';
  setTab('financial-data');
  render();
}
function buildBAAgentExplain(p){
  var text = '';
  if (BA_ANALYSIS_UI.section==='risk'){
    var risks = getBARiskItems(p).slice().sort(function(a,b){ return b.score-a.score; });
    text = risks.map(function(r){ return '• <strong>'+esc(r.title)+'</strong> (امتیاز '+r.score+'/۱۰۰): '+esc(r.analysis)+' — <em>'+esc(r.recommendation)+'</em>'; }).join('<br>');
  } else if (BA_ANALYSIS_UI.section==='ratios'){
    text = 'جدول نسبت‌های مالی در ۴ گروه تنظیم شده است (اهرم/پوشش بهره، کارایی/نقدینگی، سودآوری/بازدهی، جریان نقد/بازار). '+
      'برای هر نسبت، مقدار هر سال، فرمول و تفسیر آن در دسترس است. روی «روند» هر نسبت کلیک کنید تا روند سال‌ها و تفسیر دیده شود؛ '+
      'یا چند نسبت را تیک بزنید و «تحلیل هوشمند» را بزنید.';
  } else {
    var data = BA_STATEMENT_ANALYSIS_DEMO[BA_ANALYSIS_UI.statement];
    text = '<strong>'+esc(data.title)+'</strong> — '+esc(data.summary)+' برای مشاهده داده‌های تفصیلی این صورت، «مشاهده داده‌های این صورت» را بزنید.';
  }
  return '<div class="card card-pad" style="margin-top:14px;border-color:var(--accent);background:var(--accent-tint);">'+
    '<div style="font-weight:700;font-size:13px;margin-bottom:8px;">✦ توضیح دقیق (ایجنت)</div>'+
    '<div style="font-size:12.5px;line-height:2;color:var(--ink);">'+text+'</div>'+
    '<button class="btn small ghost" style="margin-top:10px;" onclick="setBAAgentMode(null)">بستن ✕</button>'+
  '</div>';
}
function buildBAAgentApply(p){
  var a = BA_FIN_UI.assumptions;
  var rows = ['inflation','salesGrowth','productionGrowth'].map(function(key){
    var label = {inflation:'نرخ تورم (%)',salesGrowth:'رشد فروش (%)',productionGrowth:'رشد تولید (%)'}[key];
    return '<div class="q-row"><span class="lbl">'+label+'</span>'+
      '<input id="agent-'+key+'" type="number" value="'+a[key]+'" step="0.5"/></div>';
  }).join('');
  return '<div class="card card-pad" style="margin-top:14px;border-color:var(--accent);background:var(--accent-tint);">'+
    '<div style="font-weight:700;font-size:13px;margin-bottom:8px;">⚙️ اعمال تغییر مفروضات (ایجنت)</div>'+
    '<div style="font-size:11.5px;color:var(--ink-muted);margin-bottom:8px;">مقادیر را تغییر دهید تا پیش‌بینی مالی به‌روز شود (فقط بخش‌های تاییدشده).</div>'+
    rows+
    '<div class="edit-actions" style="margin-top:10px;"><button class="btn small primary" onclick="applyBAAssumption(\'inflation\')">اعمال همه</button>'+
    '<button class="btn small ghost" onclick="setBAAgentMode(null)">بستن ✕</button></div>'+
    (UI.baAgentOut ? '<p style="font-size:12px;color:var(--positive);margin:10px 0 0;">'+esc(UI.baAgentOut)+'</p>' : '')+
  '</div>';
}

function getBAFinancialHistory(row){

  var existing =
    row.values.slice();


  if(existing.length>=10){

    return existing.slice(-10);

  }


  var missing =
    10-existing.length;


  var first =
    existing.length
      ? existing[0]
      : 0;


  var older = [];


  for(var i=missing;i>0;i--){

    /*
      فقط برای Demo:
      بازسازی ساده روند سال‌های قدیمی‌تر.
      هیچ ارتباطی با موتور محاسبات Excel ندارد.
    */

    older.push(

      Math.round(
        first *
        Math.pow(0.91,i)
      )

    );

  }


  return older.concat(existing);

}

function baFinancialChangePercent(previous,current){

  if(
    previous==null ||
    current==null ||
    previous===0
  ){

    return null;

  }


  /*
    اگر علامت عدد عوض شده باشد،
    نمایش درصد رشد می‌تواند گمراه‌کننده باشد.
  */

  if(
    previous * current < 0
  ){

    return null;

  }


  return (

    (current-previous) /
    Math.abs(previous)

  ) * 100;

}

function getBAInteractiveForecast(row){

  var history =
    getBAFinancialHistory(row);


  var last =
    history[
      history.length-1
    ] || 0;


  var salesGrowth =
    BA_FIN_UI.assumptions.salesGrowth / 100;


  var productionGrowth =
    BA_FIN_UI.assumptions.productionGrowth / 100;


  var inflation =
    BA_FIN_UI.assumptions.inflation / 100;


  /*
    این مدل فقط برای Prototype است.
    فرمول واقعی Excel نیست.
  */

  var growth =
    salesGrowth * 0.55 +
    productionGrowth * 0.30 +
    inflation * 0.15;


  /*
    هزینه‌ها و اعداد منفی نباید
    رفتار غیرطبیعی پیدا کنند.
  */

  var direction =
    last < 0 ? -1 : 1;


  var base =
    Math.abs(last);


  var output = [];


  for(
    var i=1;
    i<=BA_FIN_UI.forecastYears;
    i++
  ){

    base =
      base *
      (1 + growth);


    output.push(
      Math.round(
        base * direction
      )
    );

  }


  return output;

}

function buildBAFinancialTable(mode){

  var dataset =
    BA_FINANCIAL_DEMO[
      BA_FIN_UI.statement
    ];


  var count =
    Math.min(
      BA_FIN_UI.range,
      BA_FIN_HISTORY_YEARS.length
    );


  var years =
    BA_FIN_HISTORY_YEARS
    .slice(
      BA_FIN_HISTORY_YEARS.length-count
    );


  var header =
    years.map(
      function(year){

        return (
          '<th>'+
          year+
          '</th>'
        );

      }
    ).join('');


if(BA_FIN_UI.forecast){

  header +=

    getBAForecastYearLabels()
    .map(function(year){

      return (
        '<th class="financial-forecast">'+
        year+
        '</th>'
      );

    })
    .join('');

}



  var rows =
    dataset.rows
    .map(
      function(row,index){


        var details =
          (
            BA_FIN_DRILLDOWN[
              BA_FIN_UI.statement
            ] || {}
          )[index];


        var expandable =
          details &&
          details.length;


        var rowKey =
          BA_FIN_UI.statement+
          ':'+
          index;


        var expanded =
          BA_FIN_UI.expandedRow===
          rowKey;


        var html =

          '<tr class="'+
          (expandable?'financial-parent-row':'')+
          '">'+


          '<td class="financial-row-label">'+


            (
              expandable
              ?
              '<button '+
              'class="financial-expand-btn" '+
              'onclick="toggleBAFinancialRow('+
              index+
              ')">'+
              (expanded?'−':'+')+
              '</button>'
              :
              ''
            )+


            esc(row.label)+


          '</td>'+


          buildBAFinancialCells(
            row,
            mode,
            1
          )+


          '</tr>';



        if(
          expanded &&
          expandable
        ){

          details.forEach(
            function(detail){


              html +=

                '<tr class="financial-detail-row">'+


                '<td class="financial-row-label">'+

                  '<span class="financial-detail-arrow">'+
                  '↳'+
                  '</span>'+

                  esc(detail.label)+

                '</td>'+


                buildBAFinancialCells(
                  row,
                  mode,
                  detail.factor
                )+


                '</tr>';

            }
          );

        }


        return html;

      }
    )
    .join('');



  return `

<div class="table-wrap">

<table class="financial-table">

  <thead>

    <tr>

      <th>
        شرح
      </th>

      ${header}

    </tr>

  </thead>


  <tbody>

    ${rows}

  </tbody>

</table>

</div>



<div class="financial-table-foot">

  <span>

    ${
      mode==='percent'
      ?
      'نمایش: درصد تغییر نسبت به دوره قبل'
      :
      'واحد: میلیارد ریال'
    }

  </span>


  <span>
    بازه قابل نمایش: حداکثر ۱۰ سال
  </span>


  ${
    BA_FIN_UI.forecast
    ?
    `
    <span class="financial-forecast-note">
      * ستون‌های خاکستری پیش‌بینی هستند
    </span>
    `
    :
    ''
  }

</div>

`;

}

function buildBAFinancialChart(){

  var dataset =
    BA_FINANCIAL_DEMO[
      BA_FIN_UI.statement
    ];


  if(!dataset){

    return (
      '<div class="financial-placeholder">'+
        '<strong>داده نمودار موجود نیست</strong>'+
      '</div>'
    );

  }


  var indexes =
    BA_FIN_CHART_ROWS[
      BA_FIN_UI.statement
    ] || [0];


  var count =
    Math.min(
      Number(BA_FIN_UI.range) || 5,
      BA_FIN_HISTORY_YEARS.length
    );


  var chartYears =
    BA_FIN_HISTORY_YEARS.slice(
      BA_FIN_HISTORY_YEARS.length-count
    );


  if(BA_FIN_UI.forecast){

    chartYears =
      chartYears.concat(
        getBAForecastYearLabels()
      );

  }


  var series =
    indexes.map(function(index){

      var row =
        dataset.rows[index];


      if(!row){

        return null;

      }


      var rowHistory =
        getBAFinancialHistory(row);


      var chartValues =
        rowHistory.slice(
          rowHistory.length-count
        );


      if(BA_FIN_UI.forecast){

        var forecastValues =
          getBAInteractiveForecast(row);


        chartValues =
          chartValues.concat(
            forecastValues
          );

      }


      return {

        label:row.label,

        values:chartValues

      };

    })
    .filter(Boolean);



  if(!series.length){

    return (
      '<div class="financial-placeholder">'+
        '<strong>سری داده‌ای برای نمودار موجود نیست</strong>'+
      '</div>'
    );

  }



  var allValues = [];


  series.forEach(function(item){

    allValues =
      allValues.concat(
        item.values
      );

  });



  allValues =
    allValues.filter(function(value){

      return (
        typeof value==='number' &&
        isFinite(value)
      );

    });



  if(!allValues.length){

    return (
      '<div class="financial-placeholder">'+
        '<strong>مقادیر نمودار معتبر نیستند</strong>'+
      '</div>'
    );

  }



  var min =
    Math.min.apply(
      null,
      allValues
    );


  var max =
    Math.max.apply(
      null,
      allValues
    );


  if(min===max){

    max = min+1;

  }



  var width = 760;

  var height = 290;

  var left = 60;

  var top = 25;

  var right = 25;

  var bottom = 50;


  var plotWidth =
    width-left-right;


  var plotHeight =
    height-top-bottom;



  function getX(index){

    if(chartYears.length<=1){

      return left+
        plotWidth/2;

    }


    return (
      left+
      (
        index *
        plotWidth /
        (chartYears.length-1)
      )
    );

  }



  function getY(value){

    return (
      top+
      (
        (max-value) /
        (max-min)
      ) *
      plotHeight
    );

  }



  var gridHtml = '';


  for(var g=0;g<=4;g++){

    var gridY =
      top+
      (
        plotHeight *
        g /
        4
      );


    gridHtml +=

      '<line '+
        'x1="'+left+'" '+
        'x2="'+(width-right)+'" '+
        'y1="'+gridY+'" '+
        'y2="'+gridY+'" '+
        'class="fin-chart-grid" '+
      '/>';

  }



  var yearLabelsHtml =
    chartYears.map(
      function(year,index){

        return (

          '<text '+
            'x="'+getX(index)+'" '+
            'y="'+(height-17)+'" '+
            'class="fin-chart-year">'+
            esc(year)+
          '</text>'

        );

      }
    ).join('');



  var linesHtml =
    series.map(
      function(item,seriesIndex){


        var points =
          item.values.map(
            function(value,index){

              return (
                getX(index)+
                ','+
                getY(value)
              );

            }
          ).join(' ');



        var circles =
          item.values.map(
            function(value,index){

              return (

                '<circle '+
                  'cx="'+getX(index)+'" '+
                  'cy="'+getY(value)+'" '+
                  'r="3" '+
                  'class="fin-chart-point line-'+
                  seriesIndex+
                  '" '+
                '/>'

              );

            }
          ).join('');



        return (

          '<polyline '+
            'points="'+points+'" '+
            'class="fin-chart-line line-'+
            seriesIndex+
            '" '+
          '/>'+

          circles

        );

      }
    ).join('');



  var legendHtml =
    series.map(
      function(item,index){

        return (

          '<div class="fin-chart-legend-item">'+

            '<span class="fin-chart-legend-dot line-'+
            index+
            '"></span>'+

            esc(item.label)+

          '</div>'

        );

      }
    ).join('');



  return (

    '<div class="financial-chart-card">'+


      '<div class="fin-chart-legend">'+
        legendHtml+
      '</div>'+


      '<div class="financial-chart-scroll">'+

        '<svg '+
          'class="financial-svg-chart" '+
          'viewBox="0 0 '+width+' '+height+'"'+
        '>'+


          gridHtml+


          '<text '+
            'x="'+(left-8)+'" '+
            'y="'+(top+5)+'" '+
            'class="fin-chart-axis">'+
            fmtNum(max)+
          '</text>'+


          '<text '+
            'x="'+(left-8)+'" '+
            'y="'+(top+plotHeight)+'" '+
            'class="fin-chart-axis">'+
            fmtNum(min)+
          '</text>'+


          linesHtml+

          yearLabelsHtml+


        '</svg>'+


      '</div>'+


      '<div class="financial-table-foot">'+

        '<span>'+
          'روند چندساله اقلام منتخب صورت مالی'+
        '</span>'+


        (
          BA_FIN_UI.forecast
          ?
          '<span class="financial-forecast-note">'+
            '* دوره‌های انتهایی، پیش‌بینی سناریویی هستند'+
          '</span>'
          :
          ''
        )+


      '</div>'+


    '</div>'

  );

}

function buildBADataReadiness(p){

  var keys =
    Object.keys(
      p.fields || {}
    );


  var total =
    keys.length;


  /*
    فیلدهای واقعاً دارای مقدار نهایی
  */

  var completed =
    keys.filter(function(key){

      var info =
        resolvedValueInfo(
          p,
          key
        );


      if(!info){
        return false;
      }


      if(
        info.value === null ||
        info.value === undefined
      ){
        return false;
      }


      return (
        String(info.value).trim() !== ''
      );

    }).length;



  /*
    تعارض منابع
  */

  var conflicts =
    countFieldConflicts(p);



  /*
    مقادیر OCR با اطمینان پایین
  */

  var lowConfidence =
    keys.filter(function(key){

      var info =
        resolvedValueInfo(
          p,
          key
        );


      return (

        info &&

        info.source ===
          'DOCUMENT_OCR' &&

        info.confidence != null &&

        info.confidence < 0.75

      );

    }).length;



  /*
    ناسازگاری‌های Cross-check
  */

  var crossChecks =
    runCrossChecks(p);


  var criticalChecks =
    crossChecks.filter(function(item){

      return item.severity === 'risk';

    }).length;


  var warningChecks =
    crossChecks.filter(function(item){

      return item.severity === 'warn';

    }).length;



  /*
    درصد پوشش داده
  */

  var completionPct =
    total
      ?
      Math.round(
        completed / total * 100
      )
      :
      0;



  /*
    امتیاز نمایشی آمادگی داده

    نکته:
    این امتیاز صرفاً برای Prototype است.
  */

  var penalty =

    conflicts * 4 +

    lowConfidence * 3 +

    criticalChecks * 6 +

    warningChecks * 3;



  var readiness =
    Math.max(
      0,
      Math.min(
        100,
        completionPct - penalty
      )
    );



  var status =
    readiness >= 80
      ?
      'ok'
      :
      (
        readiness >= 60
          ?
          'warn'
          :
          'risk'
      );



  var statusText =
    readiness >= 80
      ?
      'آماده برای تحلیل'
      :
      (
        readiness >= 60
          ?
          'نیازمند بررسی محدود'
          :
          'نیازمند تکمیل داده'
      );



  return (

    '<div class="section-head">'+

      '<div>'+

        '<h3>'+
          'آمادگی داده و اقدامات سریع'+
        '</h3>'+

        '<span class="hint">'+
          'وضعیت کیفیت ورودی‌ها پیش از تصمیم‌گیری مدیریتی'+
        '</span>'+

      '</div>'+

    '</div>'+



    '<div class="ba-data-readiness-grid">'+



      /* =========================
         Data Readiness
         ========================= */

      '<div class="card card-pad ba-data-readiness-card">'+


        '<div class="ba-data-score-area">'+


          sealHTML(
            readiness,
            status,
            'lg'
          )+


          '<div>'+

            '<strong>'+
              'آمادگی داده برای تحلیل'+
            '</strong>'+

            '<div class="ba-data-status">'+
              esc(statusText)+
            '</div>'+

            '<div class="ba-data-caption">'+
              'امتیاز نمایشی بر اساس تکمیل داده، تعارض منابع، کیفیت OCR و Cross-check'+
            '</div>'+

          '</div>'+


        '</div>'+



        '<div class="ba-data-stats">'+


          '<div>'+

            '<strong>'+
              faNum(completed)+
              ' / '+
              faNum(total)+
            '</strong>'+

            '<span>'+
              'فیلد تکمیل‌شده'+
            '</span>'+

          '</div>'+



          '<div>'+

            '<strong>'+
              faNum(conflicts)+
            '</strong>'+

            '<span>'+
              'تعارض منبع'+
            '</span>'+

          '</div>'+



          '<div>'+

            '<strong>'+
              faNum(lowConfidence)+
            '</strong>'+

            '<span>'+
              'OCR کم‌اطمینان'+
            '</span>'+

          '</div>'+



          '<div>'+

            '<strong>'+
              faNum(crossChecks.length)+
            '</strong>'+

            '<span>'+
              'ناسازگاری داده'+
            '</span>'+

          '</div>'+


        '</div>'+



        '<div class="ba-data-progress">'+

          '<div class="ba-data-progress-head">'+

            '<span>'+
              'پوشش داده'+
            '</span>'+

            '<strong>'+
              faNum(completionPct)+
              '%'+
            '</strong>'+

          '</div>'+


          '<div class="ba-data-progress-track">'+

            '<span style="width:'+

            '%"></span>'+

          '</div>'+

      /* =========================

         ========================= */

      '<div class="card card-pad ba-quick-panel">'+

        '</div>'+

function buildBAExecutiveNewsSnapshot(p){

  if(
    typeof BA_NEWS_DEMO === 'undefined' ||
    !BA_NEWS_DEMO ||
    !BA_NEWS_DEMO.length
  ){

    return '';

  }


  /*
    سه خبر با بیشترین ارتباط
  */

  var news =
    BA_NEWS_DEMO
      .slice()
      .sort(function(a,b){

        return (
          (b.relevance || 0) -
          (a.relevance || 0)
        );

      })
      .slice(0,3);



  var positive =
    BA_NEWS_DEMO.filter(function(item){

      return item.impact === 'positive';

    }).length;


  var negative =
    BA_NEWS_DEMO.filter(function(item){

      return item.impact === 'negative';

    }).length;


  var neutral =
    BA_NEWS_DEMO.filter(function(item){

      return item.impact === 'neutral';

    }).length;



  function impactLabel(impact){

    if(
      typeof baNewsImpactLabel === 'function'
    ){

      return baNewsImpactLabel(
        impact
      );

    }

    return impact === 'positive'
      ? 'مثبت'
      : (
          impact === 'negative'
            ? 'منفی'
            : 'خنثی'
        );

  }



  function intensityLabel(value){

    if(
      typeof baNewsIntensityLabel === 'function'
    ){

      return baNewsIntensityLabel(
        value
      );

    }

    return value === 'high'
      ? 'بالا'
      : (
          value === 'medium'
            ? 'متوسط'
            : 'کم'
        );

  }



  var cards =
    news.map(function(item){

      var impactClass =
        item.impact === 'positive'
          ? 'positive'
          : (
              item.impact === 'negative'

function questionnaireGroups(p){
  var groups = {}, order = [];
  Object.keys(p.fields).forEach(function(k){
    var g = k.split('.')[0];
    if (!groups[g]){ groups[g] = []; order.push(g); }
    groups[g].push(k);
  });
  return { groups:groups, order:order };
}
function setQTab(pid, tabKey){ UI.qTab = tabKey; UI.qHighlight = null; render(); }
function jumpToUnanswered(pid){
  var p = DB.projects[pid];
  var q = p.questionnaire = p.questionnaire || { base:{} };
  var baseQs = Q_BASE_QUESTIONS[p.type] || [];
  var g = questionnaireGroups(p);
  var target = null;
  for (var i=0;i<baseQs.length;i++){ if (!q.base[baseQs[i].key]){ target = { tab:'__base__', key:baseQs[i].key }; break; } }
  if (!target){
    outer: for (var gi=0; gi<g.order.length; gi++){
      var keys = g.groups[g.order[gi]];
      for (var ki=0; ki<keys.length; ki++){
        if (p.fields[keys[ki]].values.length===0){ target = { tab:g.order[gi], key:keys[ki] }; break outer; }
      }
    }
  }
  if (!target){ alert('همه سؤالات پرسشنامه پاسخ داده شده‌اند.'); return; }
  UI.qTab = target.tab;
  UI.qHighlight = target.tab+':'+target.key;
  render();
  var rowId = target.tab==='__base__' ? ('qrow-base-'+p.id+'-'+target.key) : ('qrow-detail-'+p.id+'-'+target.key.replace(/\./g,'-'));
  var el = document.getElementById(rowId);
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior:'smooth', block:'center' });
}

function buildSmartQuestionField(p, key){

  var f = p.fields[key];

  var resolvedId =
    resolveFieldId(f, p);

  var resolvedVal =
    f.values.filter(function(v){
      return v.id===resolvedId;
    })[0] || null;


  var conflict =
    fieldHasConflict(f);


  var isPinned =
    !!f.pinnedId;


  /*
    ورود دستی را تأیید کاربر در نظر می‌گیریم.
    همچنین هر مقدار Pin شده، مقدار تأییدشده است.
  */
  var isConfirmed =
    !!resolvedVal &&
    (
      isPinned ||
      resolvedVal.source==='MANUAL_ENTRY'
    );


  /*
    مقدار OCR / API / AI که هنوز Pin نشده
    یک پیشنهاد سیستم محسوب می‌شود.
  */
  var isSuggestion =
    !!resolvedVal &&
    !isConfirmed;


  var display =
    smartFieldDisplayValue(
      f,
      resolvedVal
    );


  var inputId =
    'q-'+p.id+'-'+key;


  var rowId =
    'qrow-detail-'+
    p.id+'-'+
    key.replace(/\./g,'-');


  var unanswered =
    f.values.length===0;


  var highlight =
    UI.qHighlight===
    UI.qTab+':'+key;


  var confidenceHtml = '';

  if (
    resolvedVal &&
    resolvedVal.confidence!=null
  ){

    confidenceHtml =
      '<span class="pill muted">'+
      'اطمینان '+
      Math.round(
        resolvedVal.confidence*100
      )+
      '%'+
      '</span>';
  }


  var statusHtml = '';

  if (unanswered){

    statusHtml =
      '<span class="pill warn">'+
      'بدون داده'+
      '</span>';

  } else if (isSuggestion){

    statusHtml =
      '<span class="pill muted">'+
      'پیشنهاد سیستم — نیازمند تأیید'+
      '</span>';

  } else {

    statusHtml =
      '<span class="pill ok">'+
      'تأیید شده'+
      '</span>';
  }


  var conflictHtml =
    conflict
      ?
      '<span class="pill conflict">'+
      'تعارض منابع'+
      '</span>'
      :
      '';


  var sourceHtml =
    resolvedVal
      ?
      '<span class="pill source '+
      resolvedVal.source+
      '">'+
      SOURCE_LABEL[
        resolvedVal.source
      ]+
      '</span>'
      :
      '';


  var actions = '';

  if (can('editFields')){

    if (
      resolvedVal &&
      isSuggestion
    ){

      actions +=
        '<button '+
        'class="btn small primary" '+
        'onclick="pinValue(\''+
        p.id+
        '\',\''+
        key+
        '\',\''+
        resolvedVal.id+
        '\')">'+
        '✓ تأیید پیشنهاد'+
        '</button>';
    }


    actions +=
      '<button '+
      'class="btn small ghost" '+
      'onclick="'+
      'var e=document.getElementById(\''+
      inputId+
      '\');'+
      'if(e){e.focus();e.select();}'+
      '">'+
      'ویرایش دستی'+
      '</button>';


    if (f.values.length>1){

      actions +=
        '<button '+
        'class="btn small ghost" '+
        'onclick="toggleField(\''+
        key+
        '\')">'+
        (
          UI.expandedField===key
            ?
            'بستن منابع'
            :
            'مشاهده همه منابع'
        )+
        '</button>';
    }

  }


  var alternatives = '';

  if (
    UI.expandedField===key &&
    f.values.length
  ){

    alternatives =
      '<div class="smart-q-sources">'+

      '<div class="smart-q-sources-title">'+
      'مقادیر ثبت‌شده از منابع مختلف'+
      '</div>'+

      f.values
        .slice()
        .sort(function(a,b){
          return b.at-a.at;
        })
        .map(function(v){

          var valueText =
            smartFieldDisplayValue(
              f,
              v
            );

          var selected =
            resolvedVal &&
            resolvedVal.id===v.id;

          var conf =
            v.confidence!=null
              ?
              '<span class="pill muted">'+
              'اطمینان '+
              Math.round(
                v.confidence*100
              )+
              '%'+
              '</span>'
              :
              '';

          return (
            '<div class="smart-q-source-item'+
            (selected?' selected':'')+

              '<span class="pill source '+
              v.source+
              '">'+
              SOURCE_LABEL[v.source]+
              '</span>'+

              '<span class="smart-q-source-value">'+
              esc(valueText)+
              '</span>'+

              conf+

              (
                selected
                  ?
                  '<span class="pill ok">'+
                  'مقدار فعلی'+
                  '</span>'
                  :
                  (
                    can('editFields')
                      ?
                      '<button '+
                      'class="btn small ghost" '+
                      'onclick="pinValue(\''+
                      p.id+
                      '\',\''+
                      key+
                      '\',\''+
                      v.id+
                      '\')">'+
                      'انتخاب این مقدار'+
                      '</button>'
                      :
                      ''
                  )
              )+

            '</div>'
          );

        }).join('')+

      '</div>';
  }


  return (

    '<div '+
    'id="'+rowId+'" '+
    'class="smart-q-field'+
    (unanswered?' unanswered':'')+
    (highlight?' highlight-jump':'')+
    (conflict?' has-conflict':'')+
    '">'+


      '<div class="smart-q-head">'+

        '<div>'+

          '<div class="smart-q-label">'+
          esc(f.label)+

          '<div class="smart-q-badges">'+
          statusHtml+
          sourceHtml+
          confidenceHtml+
          conflictHtml+
          '</div>'+

        '</div>'+

      '</div>'+


      '<div class="smart-q-editor">'+

        (
          can('editFields')
            ?
            '<input '+
            'id="'+inputId+'" '+
            'type="text" '+
            'class="smart-q-input'+
            (isSuggestion?' suggested':'')+
            '" '+
            'value="'+esc(display)+'" '+
            'placeholder="'+
            (
              resolvedVal
                ?
                ''
                :
                'مقدار را وارد کنید'
            )+
            '" '+
            'onchange="submitQFieldValue(\''+
            p.id+
            '\',\''+
            key+
            '\',\''+
            inputId+
            '\')"'+
            '/>'
            :
            '<div class="smart-q-readonly">'+
            esc(display||'—')+
            '</div>'
        )+


        (
          isSuggestion
            ?
            '<div class="smart-q-hint">'+
            'این مقدار توسط سامانه پیشنهاد شده و هنوز توسط کاربر تأیید نشده است.'+
            '</div>'
            :
            ''
        )+

      '</div>'+


      (
        actions
          ?
          '<div class="smart-q-actions">'+
          actions+
          '</div>'
          :
          ''
      )+


      alternatives+


    '</div>'

  );
}
function getResolvedFieldValue(p,key){

    var f = p.fields[key];

    var id = resolveFieldId(f,p);

function reportChartSVG(items, title){
  var w = 560, h = 190, pad = 34, gap = 16;
  var vals = items.map(function(i){ return i.value==null?0:i.value; });
  var maxV = Math.max.apply(null, vals.concat([0])), minV = Math.min.apply(null, vals.concat([0]));
  var range = (maxV-minV) || 1;
  var barW = (w - pad*2 - gap*(items.length-1)) / items.length;
  var zeroY = h - pad - ((0-minV)/range)*(h-pad*2);
  var bars = items.map(function(it,i){
    var x = pad + i*(barW+gap);
    var val = it.value==null?0:it.value;
    var barH = Math.abs(val)/range*(h-pad*2);
    var y = val>=0 ? zeroY-barH : zeroY;
    return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(1,barH).toFixed(1)+'" rx="3" class="rc-bar"/>'+
      '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(y-(val>=0?6:-14)).toFixed(1)+'" text-anchor="middle" class="rc-val">'+esc(it.value==null?'—':fmtByFormat(it.value, it.format||'CURRENCY'))+'</text>'+
      '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(h-10)+'" text-anchor="middle" class="rc-lbl">'+esc(it.label)+'</text>';
  }).join('');
  return '<div class="report-chart-wrap">'+(title?'<div class="report-chart-title">'+esc(title)+'</div>':'')+
    '<svg class="report-chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet">'+
      '<line x1="'+pad+'" y1="'+zeroY.toFixed(1)+'" x2="'+(w-pad)+'" y2="'+zeroY.toFixed(1)+'" class="rc-axis"/>'+bars+
    '</svg>'+
  '</div>';
}
function renderReportBlock(block){


    if(block.type === 'matrix'){

      })

    return (

      '<div class="report-matrix-wrap">'+

  return '<p class="ai-text">'+esc(block.text||'')+'</p>';

function buildReportPagesHTML(p, forPrint){

  var firstApprovers = approvers.filter(function(a){ return a.placement==='FIRST_PAGE'; });
  var lastApprovers = approvers.filter(function(a){ return a.placement==='LAST_PAGE'; });

  function sigBox(a){
    var name = a.isExternal ? a.name : DB.people[a.person].name;
    var roleLabel = a.isExternal ? 'تأییدکننده خارج از سازمان' : DB.people[a.person].role;

  }
  function sigRow(list){ if (!list.length) return ''; return '<div class="signature-row">'+list.map(sigBox).join('')+'</div>'; }

  var pagesHtml = pageKeys.map(function(pageKey, idx){

      '<div class="a4-head"><h4>'+esc(def.title)+'</h4><span class="page-type-badge no-print">'+(def.type==='AI'?'تولیدشده با AI':'استاتیک')+'</span></div>'+
