function buildPlanTreeHTML(p, forPrint){
  var isActive = p.planStatus==='ACTIVE';
  var canManage = can('managePlan');

    var assignee = DB.people[node.assignee];
    var isAssignee = node.assignee===UI.currentRole;
    var canReportProgress = canManage || (isActive && isAssignee);
    var kpiTag = node.kpi && p.kpiState[node.kpi] ? '<span class="pill muted">شاخص نظارتی: '+esc(p.kpiState[node.kpi].label)+'</span>' : '';
    var dueTag = node.dueDate ? '<span class="pill muted">'+numSpan(esc(node.dueDate))+'</span>' : '';
    var mineTag = (isActive && isAssignee && !canManage) ? '<span class="pill ok">اقدام شما — گزارش پیشرفت با شماست</span>' : '';
    var ctl = (forPrint || !canReportProgress) ? '' : '<div class="progress-ctl no-print"><input type="range" min="0" max="100" value="'+node.progress+'" onchange="updateProgress(\''+p.id+'\',\''+node.id+'\',this.value)"/><span class="pct">'+numSpan(node.progress+'%')+'</span>'+
      (canManage ? '<button class="btn small ghost" onclick="sendReminder(\''+p.id+'\',\''+node.id+'\')" title="ارسال یادآوری">🔔</button>'+
      '<button class="btn small ghost" onclick="addPlanAction(\''+p.id+'\',\''+node.id+'\')" title="افزودن زیرمجموعه">+ زیرمجموعه</button>' : '')+
      '<button class="btn small ghost" onclick="addPlanAttachment(\''+p.id+'\',\''+node.id+'\')" title="افزودن پیوست">+ پیوست</button></div>';
    var attachments = (node.attachments && node.attachments.length) ? '<div class="plan-attach">'+node.attachments.map(function(a){ return '<span class="pill muted">📎 '+esc(a)+'</span>'; }).join('')+'</div>' : '';
    var children = node.children && node.children.length ? '<div class="plan-children">'+node.children.map(function(c){ return renderNode(c, depth+1); }).join('')+'</div>' : '';
    return '<div class="plan-node"><div class="plan-top"><div><div class="plan-title">'+esc(node.title)+'</div>'+
      '<div class="plan-meta">مسئول: '+esc(assignee?assignee.name:'—')+' '+dueTag+' '+kpiTag+' '+mineTag+'</div>'+
      (node.description ? '<div class="plan-desc">'+esc(node.description)+'</div>' : '')+'</div>'+
      numSpan('<b style="font-size:13px;">'+node.progress+'%</b>')+'</div>'+
      '<div class="progress-track"><div class="progress-fill" style="width:'+node.progress+'%"></div></div>'+ ctl + attachments + children +
    '</div>';
  }
  if (!p.plan || !p.plan.length) return '<p class="empty">برنامه عملیاتی هنوز تعریف نشده است.</p>';
  return p.plan.map(function(n){ return renderNode(n,0); }).join('');

function fetchApiData(pid){
  var p = DB.projects[pid];
  var keys = Object.keys(p.fields).filter(function(k){ return k.indexOf('macro.')===0; });
  if (!keys.length){ alert('برای این پروژه فیلد قابل دریافت از API تعریف نشده است.'); return; }
  keys.forEach(function(k){
    var jitter = (Math.random()-0.5)*0.01;
    var base = fieldVal(p,k) || 0.03;
    var v = { id:uid(), source:'EXTERNAL_API', value: Math.max(0, +(base+jitter).toFixed(4)), at:new Date(), confidence:0.7 };
    p.fields[k].values.push(v);
  });
  recomputeKpis(p);
  alert('داده‌های کلان با موفقیت از API دریافت و در صفحه گسترده مادر ثبت شد.');
  render();
}

function ensureFSPrototypeState(p){

  if(
    !p ||
    p.type !== 'FEASIBILITY_STUDY'
  ){

    return null;

  }


  var oldBase =
    (
      p.questionnaire &&
      p.questionnaire.base
    )
      ?
      p.questionnaire.base
      :
      {};


  if(!p.fsDemo){

    p.fsDemo = {};

  }


  var d =
    p.fsDemo;



  /*
    =========================
    Global Configuration
    =========================
  */

  if(!d.config){

    d.config = {};

  }


  /*
    Migration از مقادیر فارسی مرحله قبل
  */

  if(
    d.config.currency === 'میلیون ریال'
  ){

    d.config.currency = 'MIRR';

  }


  if(
    d.config.currency === 'ریال'
  ){

    d.config.currency = 'IRR';

  }


  if(
    d.config.inflationMode === 'غیرتورمی'
  ){

    d.config.inflationMode =
      'noninflation';

  }


  if(
    d.config.inflationMode === 'تورمی'
  ){

    d.config.inflationMode =
      'inflation';

  }


  if(
    d.config.modelType === 'فرآیندمحور'
  ){

    d.config.modelType =
      'process';

function ensureFSSalesData(p){

  var d =
    ensureFSPrototypeState(p);


  if(!d){

    return [];

  }


  if(
    !Array.isArray(d.sales)
  ){

    d.sales = [];

  }


  var products =
    (
      d.questionnaire &&
      Array.isArray(
        d.questionnaire.products
      )
    )
      ?
      d.questionnaire.products
      :
      [];


  /*
    اگر محصول جدیدی در پرسشنامه اضافه شده،
    برای آن Row فروش می‌سازیم.
  */

  products.forEach(function(product){

    var exists =
      d.sales.some(function(row){

        return (
          row.productId === product.id
        );

      });


    if(!exists){

      d.sales.push({

        id:uid(),

        productId:
          product.id,

        unit:
          'واحد',

        quantityY1:
          10000,

        unitPriceY1:
          24,

        quantityGrowth:
          12,

        priceGrowth:
          5,

        source:
          'AI_SUGGESTED',

        confirmed:
          false

      });

    }

  });


  /*
    Row مربوط به محصول حذف‌شده را نگه نمی‌داریم.
  */

  d.sales =
    d.sales.filter(function(row){

      return products.some(
        function(product){

          return (
            product.id ===
            row.productId
          );

        }
      );

    });


  return d.sales;

}

function fsSafePercent(
  value,
  total
){

  value =
    Number(value) || 0;


  total =
    Number(total) || 0;


  if(total <= 0){

    return 0;

  }


  return Math.max(
    0,
    Math.min(
      100,
      value / total * 100
    )
  );

}

function fsGetDataReadiness(p){

  var d =
    ensureFSPrototypeState(p);


  var fixed =
    ensureFSFixedInvestmentData(p);


  var operating =
    ensureFSOperatingCostData(p);


  var sales =
    ensureFSSalesData(p);


  var workingCapital =
    ensureFSWorkingCapitalData(p);


  var financing =
    ensureFSFinancingData(p);


  var completed = 0;



  /*
    1. Questionnaire
  */

  var questionnaireReady =

    d.questionnaire &&

    Array.isArray(
      d.questionnaire.products
    ) &&

    d.questionnaire.products.length > 0;


  if(questionnaireReady){

    completed++;

  }



  /*
    2. Fixed Investment
  */

  var fixedReady =

    Object.keys(
      fixed || {}
    ).some(function(key){

      return (
        Array.isArray(fixed[key]) &&
        fixed[key].length > 0
      );

    });


  if(fixedReady){

    completed++;

  }



  /*
    3. Operating Costs
  */

  var mode =

    d.config.modelType === 'project'

      ?

      'project'

      :

      'process';


  var operatingReady =

    operating &&
    operating[mode] &&

    Object.keys(
      operating[mode]
    ).some(function(key){

      return (
        Array.isArray(
          operating[mode][key]
        ) &&

        operating[mode][key].length > 0
      );

    });


  if(operatingReady){

    completed++;

  }



  /*
    4. Sales
  */

  if(
    sales &&
    sales.length
  ){

    completed++;

  }



  /*
    5. Working Capital
  */

  if(
    workingCapital &&
    workingCapital.length
  ){

    completed++;

  }



  /*
    6. Financing
  */

  if(
    financing &&
    financing.length
  ){

    completed++;

  }



  return {

    completed:
      completed,

    total:
      6,

    percent:
      completed / 6 * 100

  };

}

function fsGetFinancingMix(p){

  var rows =
    ensureFSFinancingData(p);


  var total = 0;

  var debt = 0;

  var equity = 0;



  rows.forEach(function(row){

    var amount =
      Number(
        row.amount
      ) || 0;


    total += amount;


    /*
      برای Prototype:
      منبع دارای نرخ بهره = بدهی
      بدون نرخ بهره = آورده / حقوق صاحبان سرمایه
    */

    if(
      Number(
        row.interestRate
      ) > 0
    ){

      debt += amount;

    }

    else{

      equity += amount;

    }

  });



  return {

    total:
      total,

    debt:
      debt,

    equity:
      equity,

    debtPercent:
      fsSafePercent(
        debt,
        total
      ),

    equityPercent:
      fsSafePercent(
        equity,
        total
      )

  };

}

function buildFSDashboardRisks(
  p,
  model
){

  var risks = [];


  var financingGap =

    model.initialInvestment -

    model.financingTotal;



  /*
    Funding Gap
  */

  if(
    financingGap > 0
  ){

    risks.push({

      level:'high',

      title:
        'کسری منابع مالی',

      text:
        'منابع تأمین مالی ثبت‌شده حدود '+
        fmtNum(financingGap)+
        ' کمتر از سرمایه‌گذاری اولیه موردنیاز است.'

    });

  }



  /*
    NPV
  */

  if(
    model.npv <= 0
  ){

    risks.push({

      level:'high',

      title:
        'NPV نامطلوب',

      text:
        'ارزش فعلی خالص طرح منفی یا صفر است و ساختار اقتصادی طرح نیاز به بازنگری دارد.'

    });

  }



  /*
    IRR
  */

  if(
    model.irr == null
  ){

    risks.push({

      level:'high',

      title:
        'IRR قابل محاسبه نیست',

      text:
        'الگوی جریان نقدی فعلی امکان محاسبه نرخ بازده داخلی قابل اتکا را ایجاد نکرده است.'

    });

  }

  else if(
    model.irr <
    model.discountRate * 100
  ){

    risks.push({

      level:'high',

      title:
        'بازده کمتر از نرخ تنزیل',

      text:
        'IRR طرح از نرخ تنزیل مدل پایین‌تر است.'

    });

  }



  /*
    Payback
  */

  if(
    model.payback == null
  ){

    risks.push({

      level:'medium',

      title:
        'عدم بازگشت سرمایه در افق طرح',

      text:
        'با جریان نقد فعلی، بازگشت کامل سرمایه در دوره محاسباتی مشاهده نمی‌شود.'

    });

  }

  else if(
    model.payback >
    model.horizon * 0.65
  ){

    risks.push({

      level:'medium',

      title:
        'دوره بازگشت طولانی',

      text:
        'بخش قابل توجهی از افق طرح برای بازیافت سرمایه اولیه نیاز است.'

    });

  }



  /*
    Debt Ratio
  */

  var financing =
    fsGetFinancingMix(p);


  if(
    financing.debtPercent > 65
  ){

    risks.push({

      level:'medium',

      title:
        'اتکای بالا به بدهی',

      text:
        'بیش از ۶۵٪ منابع مالی طرح از منابع دارای هزینه مالی تأمین شده است.'

    });

  }



  /*
    Margin
  */

  if(
    model.years &&
    model.years.length
  ){

    var first =
      model.years[0];


    var margin =

      first.revenue > 0

        ?

        first.netProfit /
        first.revenue *
        100

        :

        0;


    if(
      margin < 5
    ){

      risks.push({

        level:'medium',

        title:
          'حاشیه سود پایین',

        text:
          'حاشیه سود خالص سال اول پایین است و طرح نسبت به تغییر هزینه‌ها حساس خواهد بود.'

      });

    }

  }



  /*
    اگر Risk جدی نداریم
  */

  if(!risks.length){

    risks.push({

      level:'low',

      title:
        'ریسک مالی بحرانی مشاهده نشد',

      text:
        'بر اساس مفروضات فعلی، شاخص‌های اصلی اقتصادی در محدوده قابل قبول قرار دارند.'

    });

  }


  return risks;

}

function renderFSDashboardRisks(
  p,
  model
){

  var risks =
    buildFSDashboardRisks(
      p,
      model
    );


  return risks
    .slice(
      0,
      4
    )
    .map(function(risk){

      var icon =

        risk.level === 'high'

          ?

          '⚠'

          :

          (
            risk.level === 'medium'

              ?

              '△'

function buildFSDashboardTrendChart(
  model
){

  if(
    !model.years ||
    !model.years.length
  ){

    return (
      '<div class="empty">'+
        'داده‌ای برای نمایش نمودار وجود ندارد.'+
      '</div>'
    );

  }



  var width = 900;

  var height = 260;

  var padLeft = 45;

  var padRight = 20;

  var padTop = 20;

  var padBottom = 35;



  var values = [];


  model.years.forEach(
    function(item){

      values.push(
        item.revenue,
        item.netProfit,
        item.cashFlow
      );

    }
  );



  var minValue =
    Math.min.apply(
      null,
      values.concat([0])
    );


  var maxValue =
    Math.max.apply(
      null,
      values.concat([0])
    );


  if(
    maxValue === minValue
  ){

    maxValue += 1;

  }



  var plotWidth =

    width -
    padLeft -
    padRight;


  var plotHeight =

    height -
    padTop -
    padBottom;



  function x(index){

    if(
      model.years.length === 1
    ){

      return (
        padLeft +
        plotWidth / 2
      );

    }


    return (

      padLeft +

      (
        index /
        (
          model.years.length - 1
        )
      ) *

      plotWidth

    );

  }



  function y(value){

    return (

      padTop +

      (
        (
          maxValue -
          value
        ) /

        (
          maxValue -
          minValue
        )
      ) *

      plotHeight

    );

  }



  function points(key){

    return model.years
      .map(function(item,index){

        return (

          x(index)+
          ','+
          y(item[key])

        );

      })
      .join(' ');

  }



  var yearLabels =

    model.years
      .map(function(item,index){

        return (

          '<text '+
            'x="'+x(index)+'" '+
            'y="'+(height-10)+'" '+
            'class="fs-chart-year">'+

            'سال '+item.year+

          '</text>'

        );

      })
      .join('');



  var zeroY =
    y(0);



  return (

    '<div class="fs-dashboard-chart-wrap">'+


      '<svg '+
        'class="fs-dashboard-trend-svg" '+
        'viewBox="0 0 '+
          width+
          ' '+
          height+
        '" '+
        'preserveAspectRatio="none">'+


        '<line '+
          'x1="'+padLeft+'" '+
          'x2="'+(width-padRight)+'" '+
          'y1="'+zeroY+'" '+
          'y2="'+zeroY+'" '+
          'class="fs-chart-zero"'+
        '/>'+


        '<polyline '+
          'points="'+
            points('revenue')+
          '" '+
          'class="fs-chart-line revenue"'+
        '/>'+


        '<polyline '+
          'points="'+
            points('netProfit')+
          '" '+
          'class="fs-chart-line profit"'+
        '/>'+


        '<polyline '+
          'points="'+
            points('cashFlow')+
          '" '+
          'class="fs-chart-line cash"'+
        '/>'+


        yearLabels+


      '</svg>'+


      '<div class="fs-chart-legend">'+

        '<span class="revenue">'+
          '<i></i> فروش'+
        '</span>'+

        '<span class="profit">'+
          '<i></i> سود خالص'+
        '</span>'+

        '<span class="cash">'+
          '<i></i> جریان نقد'+
        '</span>'+

      '</div>'+


    '</div>'

  );

}

function fsSalesYearValue(
  row,
  yearIndex
){

  var q0 =
    Number(
      row.quantityY1
    ) || 0;


  var p0 =
    Number(
      row.unitPriceY1
    ) || 0;


  var qGrowth =
    (
      Number(
        row.quantityGrowth
      ) || 0
    ) / 100;


  var pGrowth =
    (
      Number(
        row.priceGrowth
      ) || 0
    ) / 100;


  var quantity =

    q0 *
    Math.pow(
      1 + qGrowth,
      yearIndex
    );


  var price =

    p0 *
    Math.pow(
      1 + pGrowth,
      yearIndex
    );


  return {

    quantity:
      quantity,

    price:
      price,

    revenue:
      quantity * price

  };

}

function fsUpdateSalesRow(
  pid,
  rowId,
  field,
  value
){

  var p =
    DB.projects[pid];


  if(!p){

    return;

  }


  var rows =
    ensureFSSalesData(p);


  var row =
    rows.find(function(item){

      return (
        item.id === rowId
      );

    });


  if(!row){

    return;

  }


  var numericFields = [

    'quantityY1',

    'unitPriceY1',

    'quantityGrowth',

    'priceGrowth'

  ];


  if(
    numericFields.indexOf(field) !== -1
  ){

    row[field] =
      parseFloat(value) || 0;

  }

  else{

    row[field] =
      String(value || '');

  }


  row.source =
    'MANUAL_ENTRY';


  row.confirmed =
    true;


  render();

}

function fsUpdateWorkingCapitalRow(
  pid,
  rowId,
  field,
  value
){

  var p =
    DB.projects[pid];


  if(!p){

    return;

  }


  var rows =
    ensureFSWorkingCapitalData(p);


  var row =
    rows.find(function(item){

      return (
        item.id === rowId
      );

    });


  if(!row){

    return;

  }


  if(
    field === 'quantity' ||
    field === 'unitPrice'
  ){

    row[field] =
      parseFloat(value) || 0;

  }

  else{

    row[field] =
      String(value || '');

  row.edited =

  row.confirmed =
    false;

function fsOperatingSimpleTotal(row){

  return (
    (Number(row.quantity) || 0) *
    (Number(row.unitPrice) || 0)
  );

}


function fsOperatingLaborTotal(row){

  return (
    (Number(row.headcountY1) || 0) *
    (Number(row.monthlySalary) || 0) *
    12
  );

}

function fsOperatingModeTotal(
  p,
  mode
){

  var data =
    ensureFSOperatingCostData(p);


  var section =
    data[mode];


  var total = 0;


  Object.keys(section)
    .forEach(function(key){

      section[key]
        .forEach(function(row){

          if(
            key === 'directLabor' ||
            key === 'indirectLabor' ||
            key === 'labor'
          ){

            total +=
              fsOperatingLaborTotal(row);

          }

          else{

            total +=
              fsOperatingSimpleTotal(row);

          }

        });

    });


  return total;

}

function fsOperatingCategoryTotal(
  p,
  mode,
  category
){

  var data =
    ensureFSOperatingCostData(p);


  if(
    !data ||
    !data[mode] ||
    !Array.isArray(
      data[mode][category]
    )
  ){

    return 0;

  }


  var laborCategories = [

    'directLabor',

    'indirectLabor',

    'labor'

  ];


  var isLabor =
    laborCategories.indexOf(
      category
    ) !== -1;


  return data[mode][category]
    .reduce(function(sum,row){

      return (

        sum +

        (
          isLabor

            ?

            fsOperatingLaborTotal(row)

            :

            fsOperatingSimpleTotal(row)
        )

      );

    },0);

}

function fsSalesTotalForYear(
  p,
  yearIndex
){

  var rows =
    ensureFSSalesData(p);


  return rows.reduce(
    function(sum,row){

      return (

        sum +

        fsSalesYearValue(
          row,
          yearIndex
        ).revenue

      );

    },
    0
  );

}

function fsAverageSalesQuantityGrowth(p){

  var rows =
    ensureFSSalesData(p);


  if(!rows.length){

    return 0;

  }


  var total =
    rows.reduce(function(sum,row){

      return (
        sum +
        (
          Number(
            row.quantityGrowth
          ) || 0
        )
      );

    },0);


  return (
    total /
    rows.length /
    100
  );

}


function fsAnnualFinancingCost(p){

  var rows =
    ensureFSFinancingData(p);


  return rows.reduce(
    function(sum,row){

      var amount =
        Number(
          row.amount
        ) || 0;


      var rate =
        Number(
          row.interestRate
        ) || 0;


      return (

        sum +

        (
          amount *
          rate /
          100
        )

      );

    },
    0
  );

}

function buildFSResultModel(p){

  var d =
    ensureFSPrototypeState(p);


  ensureFSFixedInvestmentData(p);

  ensureFSOperatingCostData(p);

  ensureFSSalesData(p);

  ensureFSWorkingCapitalData(p);

  ensureFSFinancingData(p);



  /* =========================================================
     تنظیمات اصلی
     ========================================================= */

  var horizon =
    Number(
      d.config.horizon
    ) || 5;


  horizon =
    Math.max(
      5,
      Math.min(
        15,
        horizon
      )
    );



  var mode =

    d.config.modelType === 'project'

      ?

      'project'

      :

      'process';



  /*
    نرخ تنزیل

    اگر از مدل قدیمی پروژه مقدار وجود داشته باشد
    استفاده می‌کنیم؛ در غیر این صورت 18%.
  */

  var legacyDiscountRate =
    fieldVal(
      p,
      'feasibility.discountRate'
    );


  var discountRate =

    (
      d.results &&
      d.results.discountRate != null
    )

      ?

      Number(
        d.results.discountRate
      )

      :

      (
        legacyDiscountRate != null

          ?

          Number(
            legacyDiscountRate
          )

          :

          0.18
      );



  /* =========================================================
     سرمایه‌گذاری
     ========================================================= */

  var fixedInvestment =
    fsFixedGrandTotal(p);


  var workingCapital =
    fsWorkingCapitalTotal(p);


  var positiveWorkingCapital =
    Math.max(
      0,
      workingCapital
    );


  var initialInvestment =

    fixedInvestment +

    positiveWorkingCapital;


  var financingTotal =
    fsFinancingTotal(p);



  /* =========================================================
     هزینه‌های پایه
     ========================================================= */

  var directBase = 0;

  var indirectBase = 0;

  var depreciationBase = 0;



  if(mode === 'process'){

    directBase =

      fsOperatingCategoryTotal(
        p,
        'process',
        'materials'
      ) +

      fsOperatingCategoryTotal(
        p,
        'process',
        'directLabor'
      ) +

      fsOperatingCategoryTotal(
        p,
        'process',
        'directOverhead'
      );



    indirectBase =

      fsOperatingCategoryTotal(
        p,
        'process',
        'indirectLabor'
      ) +

      fsOperatingCategoryTotal(
        p,
        'process',
        'adminSales'
      ) +

      fsOperatingCategoryTotal(
        p,
        'process',
        'utilities'
      ) +

      fsOperatingCategoryTotal(
        p,
        'process',
        'maintenance'
      ) +

      fsOperatingCategoryTotal(
        p,
        'process',
        'contingency'
      );



    depreciationBase =
      fsOperatingCategoryTotal(
        p,
        'process',
        'depreciation'
      );

  }

  else{

    directBase =

      fsOperatingCategoryTotal(
        p,
        'project',
        'materials'
      ) +

      fsOperatingCategoryTotal(
        p,
        'project',
        'labor'
      ) +

      fsOperatingCategoryTotal(
        p,
        'project',
        'overhead'
      ) +

      fsOperatingCategoryTotal(
        p,
        'project',
        'contractors'
      ) +

      fsOperatingCategoryTotal(
        p,
        'project',
        'other'
      );


    indirectBase = 0;


    /*
      برای Prototype پروژه‌محور:
      استهلاک نمایشی = 5% سرمایه ثابت
    */

    depreciationBase =
      fixedInvestment * 0.05;

  }



  /* =========================================================
     رشد هزینه‌ها
     ========================================================= */

  var quantityGrowth =
    fsAverageSalesQuantityGrowth(p);


  var inflationGrowth =

    d.config.inflationMode ===
      'inflation'

      ?

      0.15

      :

      0;


  /*
    هزینه مستقیم:
    رشد حجم + تورم
  */

  var directGrowth =

    (
      1 + quantityGrowth
    ) *

    (
      1 + inflationGrowth
    ) -

    1;



  /*
    هزینه‌های ثابت / غیرمستقیم:
    فقط اثر تورم
  */

  var indirectGrowth =
    inflationGrowth;



  /* =========================================================
     هزینه مالی
     ========================================================= */

  var financeCost =
    fsAnnualFinancingCost(p);



  /* =========================================================
     نرخ مالیات Prototype
     ========================================================= */

  var taxRate =
    0.20;



  /* =========================================================
     جدول سالانه
     ========================================================= */

  var years = [];


  for(
    var i = 0;
    i < horizon;
    i++
  ){

    var revenue =
      fsSalesTotalForYear(
        p,
        i
      );


    var directCosts =

      directBase *

      Math.pow(
        1 + directGrowth,
        i
      );


    var indirectCosts =

      indirectBase *

      Math.pow(
        1 + indirectGrowth,
        i
      );


    var depreciation =
      depreciationBase;


    var grossProfit =

      revenue -

      directCosts;


    var operatingProfit =

      grossProfit -

      indirectCosts -

      depreciation;


    var profitBeforeTax =

      operatingProfit -

      financeCost;


    var tax =

      profitBeforeTax > 0

        ?

        profitBeforeTax *
        taxRate

        :

        0;


    var netProfit =

      profitBeforeTax -

      tax;



    /*
      جریان نقدی:
      سود خالص + استهلاک
    */

    var cashFlow =

      netProfit +

      depreciation;



    /*
      در سال آخر سرمایه در گردش آزاد می‌شود.
    */

    var workingCapitalRecovery =
      0;


    if(
      i === horizon - 1
    ){

      workingCapitalRecovery =
        positiveWorkingCapital;


      cashFlow +=
        workingCapitalRecovery;

    }



    years.push({

      year:
        i + 1,

      revenue:
        revenue,

      directCosts:
        directCosts,

      grossProfit:
        grossProfit,

      indirectCosts:
        indirectCosts,

      depreciation:
        depreciation,

      operatingProfit:
        operatingProfit,

      financeCost:
        financeCost,

      profitBeforeTax:
        profitBeforeTax,

      tax:
        tax,

      netProfit:
        netProfit,

      workingCapitalRecovery:
        workingCapitalRecovery,

      cashFlow:
        cashFlow

    });

  }



  /* =========================================================
     Economic KPIs
     ========================================================= */

  var cashFlows =
    years.map(function(year){

      return year.cashFlow;

    });



  var npvValue =
    npv(

      discountRate,

      initialInvestment,

      cashFlows

    );



  var irrRaw =
    irr(

      initialInvestment,

      cashFlows

    );


  var irrPercent =

    irrRaw == null

      ?

      null

      :

      irrRaw * 100;



  var payback =

    paybackPeriod(

      initialInvestment,

      cashFlows

    );



  var bcrValue =

    bcr(

      discountRate,

      initialInvestment,

      cashFlows

    );



  /* =========================================================
     نتیجه توجیه‌پذیری
     ========================================================= */

  var feasible =

    npvValue > 0 &&

    irrPercent != null &&

    irrPercent >
      discountRate * 100 &&

    bcrValue != null &&

    bcrValue > 1;



  var result = {

    horizon:
      horizon,

    mode:
      mode,

    discountRate:
      discountRate,

    taxRate:
      taxRate,

    fixedInvestment:
      fixedInvestment,

    workingCapital:
      workingCapital,

    initialInvestment:
      initialInvestment,

    financingTotal:
      financingTotal,

    directBase:
      directBase,

    indirectBase:
      indirectBase,

    depreciationBase:
      depreciationBase,

    financeCost:
      financeCost,

    years:
      years,

    cashFlows:
      cashFlows,

    npv:
      npvValue,

    irr:
      irrPercent,

    payback:
      payback,

    bcr:
      bcrValue,

    feasible:
      feasible,

    statusLabel:

      feasible

        ?

        'دارای توجیه اقتصادی'

        :

        'نیازمند بازنگری'

  };



  /*
    Result Model را نگه می‌داریم
    تا Dashboard مرحله بعد از همین استفاده کند.
  */

  d.results =
    Object.assign(

      {},

      d.results || {},

      result

    );


  return d.results;

}

function fsApplyResultKpis(
  p,
  model
){

  p.kpiState.npv = {

    value:
      model.npv,

    trend:
      'UNKNOWN',

    format:
      'CURRENCY',

    label:
      'ارزش فعلی خالص (NPV)',

    prev:null

  };


  p.kpiState.irr = {

    value:
      model.irr,

    trend:
      'UNKNOWN',

    format:
      'PERCENT',

    label:
      'نرخ بازده داخلی (IRR)',

    prev:null

  };


  p.kpiState.payback_period = {

    value:
      model.payback,

    trend:
      'UNKNOWN',

    format:
      'NUMBER',

    label:
      'دوره بازگشت سرمایه',

    prev:null

  };


  p.kpiState.benefit_cost_ratio = {

    value:
      model.bcr,

    trend:
      'UNKNOWN',

    format:
      'RATIO',

    label:
      'نسبت منفعت به هزینه (BCR)',

    prev:null

  };



  /*
    Health Score نمایشی
  */

  if(
    model.irr != null
  ){

    p.health =
      Math.round(

        Math.min(

          99,

          Math.max(

            5,

            45 +
            model.irr * 1.3

          )

        )

      );


    p.healthStatus =

      p.health >= 70

        ?

        'ok'

        :

        (
          p.health >= 45

            ?

            'warn'

            :

            'risk'
        );

  }

}

function fsUpdateOperatingRow(
  pid,
  mode,
  category,
  rowId,
  field,
  value
){

  var p =
    DB.projects[pid];


  if(!p){

    return;

  }


  var data =
    ensureFSOperatingCostData(p);


  var row =
    data[mode][category]
      .find(function(item){

        return (
          item.id === rowId
        );

      });


  if(!row){

    return;

  }


  var numericFields = [

    'quantity',

    'unitPrice',

    'headcountY1',

    'headcountY2',

    'headcountY3',

    'monthlySalary'

  ];


  if(
    numericFields.indexOf(field) !== -1
  ){

    row[field] =
      parseFloat(value) || 0;

  }

  else{

    row[field] =
      String(value || '');

  }


  row.source =
    'MANUAL_ENTRY';

  row.edited =
    true;

  row.confirmed =
    false;


  render();

}

function fsAcceptOperatingRow(
  pid,
  mode,
  category,
  rowId
){

  var p =
    DB.projects[pid];


  if(!p){

    return;

  }


  var data =

      .find(function(item){

        return (
          item.id === rowId
        );

      });


  if(!row){

    return;

  }


  row.confirmed =
    true;


  render();

}
function fsRemoveOperatingRow(
  pid,
  mode,
  category,
  rowId
){

  var p =
    DB.projects[pid];


  if(!p){

    return;

  }


  var data =
    ensureFSOperatingCostData(p);


  data[mode][category] =
    data[mode][category]
      .filter(function(item){

        return (
          item.id !== rowId
        );

      });


  render();

}

function fsAddOperatingRow(
  pid,
  mode,
  category,
  kind
){

  var p =
    DB.projects[pid];


  if(!p){

    return;

  }


  var d =
    ensureFSPrototypeState(p);


  var data =
    ensureFSOperatingCostData(p);


  var products =
    d.questionnaire.products || [];


  var firstProductId =
    products.length
      ?
      products[0].id
      :
      '';



  if(kind === 'labor'){

    data[mode][category].push({

      id:uid(),

      productId:
        (
          category === 'directLabor'
            ?
            firstProductId
            :
            ''
        ),

      description:
        'نیروی انسانی جدید',

      headcountY1:1,

      headcountY2:1,

      headcountY3:1,

      monthlySalary:0,

      source:
        'MANUAL_ENTRY',

      confirmed:true

    });

  }

  else{

    data[mode][category].push({

      id:uid(),

      productId:
        (
          category === 'materials' ||
          category === 'directOverhead'
        )
          ?
          firstProductId
          :
          '',

      description:
        'آیتم جدید',

      quantity:1,

      unit:'مورد',

      unitPrice:0,

      source:
        'MANUAL_ENTRY',

      confirmed:true

    });

  }


  render();

}

function buildFSProductOptions(
  p,
  selected
){

  var d =
    ensureFSPrototypeState(p);


  return (
    d.questionnaire.products || []
  )
    .map(function(product){

      return (

        '<option value="'+
          product.id+
          '"'+
          (
            product.id === selected
              ?
              ' selected'
              :
              ''
          )+
        '>'+

          esc(product.name)+

        '</option>'

      );

    })
    .join('');

}

function buildFSOperatingSource(row){

  if(
    row.source === 'MANUAL_ENTRY'
  ){

    return (
      '<span class="pill source MANUAL_ENTRY">'+
        'ورودی کاربر'+
      '</span>'
    );

  }


  if(row.confirmed){

    return (
      '<span class="pill ok">'+
        'AI تأییدشده'+
      '</span>'
    );

  }


  return (
    '<span class="pill source AI_SUGGESTED">'+
      'پیشنهاد AI'+
    '</span>'
  );

}

function openOEditor(pid, mode, category, rowId){ UI.oEditor = {mode:mode, category:category, rowId:rowId}; render(); }
function closeOEditor(){ UI.oEditor = null; render(); }
function buildOEditor(pid){
  var o=UI.oEditor; if(!o) return '';
  var data=ensureFSOperatingCostData(DB.projects[pid]);
  var row = data[o.mode][o.category].filter(function(r){ return r.id===o.rowId; })[0];
  if(!row) return '';
  var fields=[['description','شرح','text'],['productId','محصول','text'],['title','عنوان شغلی','text'],['quantity','مقدار','number'],['unitPrice','نرخ واحد','number'],['unit','واحد','text'],['headcountY1','نیروی سال ۱','number'],['headcountY2','نیروی سال ۲','number'],['headcountY3','نیروی سال ۳','number'],['monthlySalary','حقوق ماهانه','number']];
  var rowsOut=fields.filter(function(fs){ return row[fs[0]]!==undefined; }).map(function(fs){
    return '<div class="q-row"><span class="lbl">'+fs[1]+'</span><input type="'+(fs[2]==='number'?'number':'text')+'" value="'+esc(row[fs[0]])+'" onchange="fsUpdateOperatingRow(\''+pid+'\',\''+o.mode+'\',\''+o.category+'\',\''+row.id+'\',\''+fs[0]+'\',this.value)"/></div>';
  }).join('');
  var srcName=(SOURCE_LABEL&&SOURCE_LABEL[row.source])||row.source;
  var key='op:'+o.mode+':'+o.category;
  var x=fsXGet(DB.projects[pid],key); var xCols=(x&&x.cols)||[];
  var xRows=xCols.map(function(c){ var val=(x.values[row.id]&&x.values[row.id][c.id])||''; return '<div class="q-row"><span class="lbl">'+esc(c.label)+'</span><input type="text" value="'+esc(val)+'" onchange="fsXSetCell(\''+pid+'\',\''+key+'\',\''+row.id+'\',\''+c.id+'\',this.value)"/></div>'; }).join('');
  return '<div class="modal-backdrop" onclick="if(event.target===this) closeOEditor()"><div class="modal-box">'+
    '<div class="modal-head"><h3>ویرایش آیتم هزینه</h3><button class="btn small ghost" onclick="closeOEditor()">✕</button></div>'+
    '<div class="value-item" style="margin-bottom:12px;"><span class="pill source '+esc(row.source)+'">'+esc(srcName)+'</span><span class="v" style="font-size:11px;color:var(--ink-muted);">منبع داده</span></div>'+
    rowsOut+(xCols.length?('<div class="q-section-title">ستون‌های اضافی</div>'+xRows):'')+
    '<div class="modal-actions"><span></span><button class="btn small primary" onclick="closeOEditor()">ذخیره و بستن</button></div>'+
  '</div></div>';
}

function fsFixedRowTotal(row){

  var quantity =
    Number(
      row.quantity
    ) || 0;


  var unitPrice =
    Number(
      row.unitPrice
    ) || 0;


  return (
    quantity *
    unitPrice
  );

}
function fsFixedCategoryTotal(
  p,
  category
){

  var data =
    ensureFSFixedInvestmentData(p);


  if(
    !data ||
    !Array.isArray(
      data[category]
    )
  ){

    return 0;

  }


  return data[category]
    .reduce(
      function(sum,row){

        return (
          sum +
          fsFixedRowTotal(row)
        );

      },
      0
    );

}
function fsFixedGrandTotal(p){

  var data =
    ensureFSFixedInvestmentData(p);


  if(!data){

    return 0;

  }


  return Object.keys(data)
    .reduce(
      function(sum,key){

        if(
          !Array.isArray(
            data[key]
          )
        ){

          return sum;

        }


        return (
          sum +
          fsFixedCategoryTotal(
            p,
            key
          )
        );

      },
      0
    );

}

function fsUpdateFixedInvestmentRow(
  pid,
  category,
  rowId,
  field,
  value
){

  var p =
    DB.projects[pid];


  if(!p){

    return;

  }


  var data =
    ensureFSFixedInvestmentData(p);


  var row =
    data[category].find(
      function(item){

        return (
          item.id === rowId
        );

      }
    );


  if(!row){

    return;

  }


  if(
    field === 'quantity' ||
    field === 'unitPrice'
  ){

    row[field] =
      parseFloat(value) || 0;

  }

  else{

    row[field] =
      String(
        value || ''
      ).trim();

  }


  /*
    اگر کاربر چیزی را ویرایش کند،
    دیگر AI Suggestion محسوب نمی‌شود.
  */

  row.source =
    'MANUAL_ENTRY';


  row.confirmed =
    true;


  render();

}

var FS_WIZARD_STEPS = [
  { key:'questionnaire', label:'پرسشنامه' },
  { key:'fs-fixed-investment', label:'سرمایه ثابت' },
  { key:'fs-operating-costs', label:'هزینه‌ها' },

  { key:'report', label:'گزارش' }
];
function fsWizGo(key){
  UI.fsItemIndex = -1;
  var keys = FS_WIZARD_STEPS.map(function(s){ return s.key; });
  if (keys.indexOf(key)>-1) UI.fsWizStep = key;
  setTab(key); window.scrollTo(0,0);
}
function fsWizNav(dir){
  var keys = FS_WIZARD_STEPS.map(function(s){ return s.key; });
  var i = keys.indexOf(UI.tab);
  var j = i + dir;
  if (j>=0 && j<keys.length) fsWizGo(keys[j]);
}
/* تأیید مرحلهٔ فعلی و رفتن به مرحلهٔ بعد (فرود در بالای همان مرحله) */
function fsWizConfirm(pid){
  var p = DB.projects[pid];
  /* هنگام عبور از «پرسشنامه پایه» و تکمیل اطلاعات، هشدار سهمیه ظاهر شود (فقط یک‌بار) */
  if (UI.tab==='questionnaire' && !p.fsWarnedQuota){
    if (!confirm('اطلاعات شما تکمیل شد. با ادامه، طرح امکان‌سنجی شما ایجاد می‌شود و ۱ واحد از سهمیه‌ی «امکان‌سنجی» مصرف می‌گردد.\n\nبرای تولید طرح امکان‌سنجی بعدی، باید یک پروژه‌ی جدید بسازید.\n\nادامه می‌دهید؟')){ render(); return; }
    p.fsWarnedQuota = true;
    p.fsQuotaNotice = true;
  }
  p.fsWizardDone = p.fsWizardDone || {};
  p.fsWizardDone[UI.tab] = true;
  var keys = FS_WIZARD_STEPS.map(function(s){ return s.key; });
  var i = keys.indexOf(UI.tab);
  if (i<0){ return; }
  var j = i+1;
  if (j<keys.length){ fsWizGo(keys[j]); }
  else { fsWizGo('report'); }
}
/* قدم‌زدنِ درونِ صفحه: ایتم‌به‌ایتم از بالا به پایین، بعد رفتن به مرحلهٔ بعد */
function fsWizItems(){
  var view = document.querySelector('.project-main .view');
  if (!view) return [];
  var nodes = view.querySelectorAll('.section-head h3, h3, h4, .profile-card-title, .q-section-title');
  var arr=[]; for (var i=0;i<nodes.length;i++) arr.push(nodes[i]);
  return arr;
}
function fsWizNext(pid){
  var items = fsWizItems();
  var idx = (UI.fsItemIndex==null) ? -1 : UI.fsItemIndex;
  if (items.length){
    if (idx < items.length-1){
      idx++;
      UI.fsItemIndex = idx;
      var prev = document.querySelector('.fs-item-target');
      if (prev) prev.classList.remove('fs-item-target');
      items[idx].scrollIntoView({ behavior:'smooth', block:'start' });
      items[idx].classList.add('fs-item-target');
      return;
    }
  }
  /* ایتم‌های این صفحه تمام شد → مرحلهٔ بعد */
  UI.fsItemIndex = -1;
  fsWizConfirm(pid);
}
function buildFSWizardStepper(p){
  var keys = FS_WIZARD_STEPS.map(function(s){ return s.key; });
  var cur = keys.indexOf(UI.tab);
  if (cur<0) cur = 0;
  var items = FS_WIZARD_STEPS.map(function(s,i){
    var active = s.key===UI.tab;
    var isDone = (p.fsWizardDone && p.fsWizardDone[s.key]) || i<cur;
    return '<button type="button" class="fs-wiz-step'+(active?' active':'')+(isDone?' done':'')+'" onclick="fsWizGo(\''+s.key+'\')">'+
      '<span class="n">'+(isDone?'✓':(i+1))+'</span><span class="l">'+esc(s.label)+'</span></button>';
  }).join('');
  return '<div class="fs-wizard no-print">'+
    '<div class="fs-wizard-steps">'+items+'</div>'+
  '</div>';
}

  var keys = FS_WIZARD_STEPS.map(function(s){ return s.key; });
  var cur = keys.indexOf(UI.tab);
  if (cur<0) cur = 0;
  var total = keys.length;
  var isLast = cur===total-1;

var CMP_ACCENTS = ['ba','val','fs','wl'];
function cmpAccent(i){ return CMP_ACCENTS[i % CMP_ACCENTS.length]; }
function cmpHeadRow(projects, labelColHeader){
  return '<tr><th>'+(labelColHeader||'')+'</th>'+ projects.map(function(p,i){
    var acc = cmpAccent(i);
    return '<th class="num-cell" style="box-shadow:inset 0 -2px 0 var(--cat-'+acc+');">'+
      '<span style="display:inline-flex;align-items:center;gap:6px;">'+
        '<span class="stat-dot" style="background:var(--cat-'+acc+');"></span>'+esc(DB.companies[p.companyKey].name)+
      '</span></th>';
  }).join('') +'</tr>';
}
function buildWatchlistView(){
  var w = DB.watchlists[UI.watchlistId];
  if (!w){ go('watchlists'); return ''; }
  var projects = w.projectIds.map(function(id){ return DB.projects[id]; });

  var headerCards = projects.map(function(p,i){
    var acc = cmpAccent(i), company = DB.companies[p.companyKey];
    return '<div class="card cmp-card" style="--cmp-accent:var(--cat-'+acc+');">'+
      '<div class="cmp-card-top">'+sealHTML(p.health, p.healthStatus, 'sm')+'<span class="type-chip '+typeCls(p.type)+'">'+typeLabel(p.type)+'</span></div>'+
      '<div class="cmp-card-name">'+esc(company.name)+'</div>'+
      '<div class="cmp-card-proj">'+esc(p.name)+'</div>'+
    '</div>';
  }).join('');

  var kpiKeys = {};
  projects.forEach(function(p){ Object.keys(p.kpiState).forEach(function(k){ kpiKeys[k]=true; }); });
  var byCat = {};
  Object.keys(kpiKeys).forEach(function(k){
    var cat = (KPI_DEFS[k] && KPI_DEFS[k].category) || 'other';
    byCat[cat] = byCat[cat] || [];
    byCat[cat].push(k);
  });
  var order = Object.keys(KPI_CATEGORIES).filter(function(c){ return byCat[c] && byCat[c].length; });
  Object.keys(byCat).forEach(function(c){ if (order.indexOf(c)===-1) order.push(c); });

  var kpiBody = order.map(function(cat){
    var meta = KPI_CATEGORIES[cat] || { label:'سایر شاخص‌ها', letter:'—', cls:'ba' };
    var catRow = '<tr class="cmp-cat-row"><td colspan="'+(projects.length+1)+'">'+
      '<span class="cat-badge '+meta.cls+'">'+meta.letter+'</span>'+esc(meta.label)+'</td></tr>';
    var rows = byCat[cat].map(function(k){
      var label = KPI_DEFS[k].label, format = KPI_DEFS[k].format;
      var cells = projects.map(function(p){
        var st = p.kpiState[k], status = heatStatus(p,k);
        var dotColor = status==='ok' ? 'var(--positive)' : status==='warn' ? 'var(--gold)' : status==='risk' ? 'var(--negative)' : null;
        var dot = dotColor ? '<span class="stat-dot" style="background:'+dotColor+';"></span>' : '';
        return '<td class="num-cell"><span style="display:inline-flex;align-items:center;gap:7px;">'+dot+numSpan(esc(st && st.value!=null ? fmtByFormat(st.value, format) : '—'))+'</span></td>';
      }).join('');
      return '<tr><td>'+esc(label)+'</td>'+cells+'</tr>';
    }).join('');
    return catRow + rows;
  }).join('') || ('<tr><td class="empty" colspan="'+(projects.length+1)+'">شاخصی موجود نیست</td></tr>');

  function planAvgAndCount(p){
    if (!p.plan || !p.plan.length) return { avg:null, count:0 };
    var sum=0; p.plan.forEach(function(n){ sum+=n.progress; });
    return { avg: sum/p.plan.length, count:p.plan.length };
  }
  var planCells = projects.map(function(p,i){
    var r = planAvgAndCount(p);
    if (r.count===0) return '<td class="num-cell"><span class="pill muted">بدون برنامه</span></td>';
    return '<td class="num-cell">'+
      '<div style="display:flex;align-items:baseline;justify-content:flex-end;gap:6px;">'+numSpan('<b>'+r.avg.toFixed(0)+'%</b>')+
        '<span style="font-size:11px;color:var(--ink-faint);">('+r.count+' اقدام اصلی)</span></div>'+
      '<div class="progress-track" style="margin-top:7px;"><div class="progress-fill" style="width:'+r.avg+'%;background:var(--cat-'+cmpAccent(i)+');"></div></div>'+
    '</td>';
  }).join('');

  var kpiHead = cmpHeadRow(projects);
  var planHead = cmpHeadRow(projects);

  return '<div class="topbar"><div><div class="crumb"><a href="javascript:void(0)" onclick="go(\'watchlists\')" style="text-decoration:none;">'+esc(DB.account.name)+'</a> <span style="color:var(--ink-faint);">/</span> <a href="javascript:void(0)" onclick="go(\'watchlists\')" style="text-decoration:none;">واچ‌لیست‌ها</a></div><h2>'+esc(w.name)+'</h2></div></div>'+
    '<div class="view">'+
      '<div class="section-head"><h3>در حال مقایسه</h3><span class="hint">'+projects.length+' پروژه</span></div>'+
      '<div class="cmp-head-row">'+headerCards+'</div>'+
      '<div class="section-head"><h3>مقایسه شاخص‌ها</h3></div>'+
      '<div class="table-wrap"><table><thead>'+kpiHead+'</thead><tbody>'+ kpiBody +'</tbody></table></div>'+
      '<div class="section-head"><h3>مقایسه برنامه عملیاتی</h3></div>'+
      '<div class="table-wrap"><table><thead>'+planHead+'</thead><tbody><tr><td>میانگین پیشرفت</td>'+planCells+'</tr></tbody></table></div>'+
    '</div>';
}

function personQuota(personKey, type){
  var person = DB.people[personKey];
  if (!person || person.capRole!=='pm' || !person.quotaAllocation || person.quotaAllocation[type]==null) return null;
  var total = person.quotaAllocation[type];
  var used = Object.keys(DB.projects).filter(function(pid){ var pr = DB.projects[pid]; return pr.createdBy===personKey && pr.type===type; }).length;
  return { used:used, total:total };
}
function quotaBlockReason(type){
  var q = DB.account.quotas[type];
  if (q.used>=q.total) return 'سهمیه این نوع خدمت در بسته حساب تکمیل شده است.';

}

function pfsPreviewHtml(file, hideActions){
  var sizeKb = Math.round(file.size/1024);
  var sizeLbl = sizeKb>1024 ? (sizeKb/1024).toFixed(1)+' مگابایت' : sizeKb+' کیلوبایت';
  var inner;
  if (file.type==='application/pdf'){
    inner = '<iframe src="'+file.dataUrl+'" style="width:100%;height:260px;border:1px solid var(--border);border-radius:8px;background:var(--surface);"></iframe>';
  } else if (file.type.indexOf('image/')===0){
    inner = '<img src="'+file.dataUrl+'" style="max-width:100%;max-height:260px;border-radius:8px;border:1px solid var(--border);display:block;"/>';
  } else {

  }
  return '<div class="pfs-preview">'+inner+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px;">'+
      '<span style="font-size:11.5px;color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(file.name)+' ('+sizeLbl+')</span>'+
      (hideActions ? '' : '<button class="btn small ghost" onclick="removePreFsUpload()" style="flex:none;">حذف و تغییر فایل</button>')+
    '</div>'+
  '</div>';
}
function handlePreFsUpload(input){

    UI.wizard.preFsFile = { name:file.name, size:file.size, type:file.type, dataUrl:e.target.result };
    render();
  };
  reader.readAsDataURL(file);
}

function setUserCapRole(personKey, capRole){
  var person = DB.people[personKey];
  if (person.capRole==='admin' && capRole!=='admin'){
    var otherAdmins = Object.keys(DB.people).filter(function(k){ return k!==personKey && DB.people[k].capRole==='admin'; });
    if (!otherAdmins.length){ alert('باید حداقل یک مدیر سامانه در حساب باقی بماند.'); render(); return; }
  }
  person.capRole = capRole;
  person.role = CAP_ROLE_LABELS[capRole];
  if (capRole!=='pm') person.quotaAllocation = null;
  render();
}
function setPersonQuota(personKey, type, value){
  var person = DB.people[personKey];
  person.quotaAllocation = person.quotaAllocation || {};
  var n = parseInt(value,10);
  person.quotaAllocation[type] = (value==='' || isNaN(n)) ? null : Math.max(0,n);
  render();
}
function removeAccountUser(personKey){
  var person = DB.people[personKey];
  if (person.capRole==='admin'){
    var otherAdmins = Object.keys(DB.people).filter(function(k){ return k!==personKey && DB.people[k].capRole==='admin'; });
    if (!otherAdmins.length){ alert('باید حداقل یک مدیر سامانه در حساب باقی بماند.'); return; }
  }
  if (!confirm('کاربر «'+person.name+'» حذف شود؟ عضویت او در پروژه‌ها و جایگاه تأییدکنندگی او نیز حذف می‌شود.')) return;
  delete DB.people[personKey];
  Object.keys(DB.projects).forEach(function(pid){
    var p = DB.projects[pid];
    p.members = p.members.filter(function(m){ return m.p!==personKey; });
    p.report.approvers = p.report.approvers.filter(function(a){ return a.person!==personKey; });
  });
  render();
}

            (pq ? '<span class="pill muted">'+pq.used+'/'+pq.total+' مصرف‌شده</span>' : '<span class="pill ok">نامحدود (تا سقف سهمیه حساب)</span>')+
            '<input id="'+inputId+'" type="number" min="0" placeholder="نامحدود" value="'+v+'" style="width:84px;" onchange="setPersonQuota(\''+k+'\',\''+t+'\',this.value)"/>'+
          '</div>';
        }).join('')+
      '</div>';
    }
    return '<div class="card card-pad" style="margin-bottom:14px;">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">'+
        '<div><div style="font-weight:700;font-size:13.5px;">'+esc(person.name)+(isSelf?' <span class="pill muted">شما</span>':'')+'</div>'+
        '<div style="font-size:11.5px;color:var(--ink-muted);margin-top:2px;">عضو '+projectCount+' پروژه</div></div>'+
        '<div style="display:flex;align-items:center;gap:8px;">'+
          '<select class="role-select" onchange="setUserCapRole(\''+k+'\',this.value)">'+roleOpts+'</select>'+
          (!isSelf ? '<button class="btn small ghost" onclick="removeAccountUser(\''+k+'\')">حذف</button>' : '')+
        '</div>'+
      '</div>'+
      quotaBlock+
    '</div>';
  }).join('');

  return '<div class="view">'+
    '<div class="section-head"><h3>کاربران حساب</h3><span class="hint">تعریف نقش هر کاربر و سهمیه اختصاصی مدیران پروژه از سهمیه کلی حساب</span></div>'+
    rows+
    '<div class="card card-pad">'+
      '<div class="section-head" style="margin:0 0 10px;"><h3>افزودن کاربر جدید</h3></div>'+
      '<div class="inline-form">'+
        '<input id="newuser-name" type="text" placeholder="نام و نام خانوادگی" style="min-width:200px;"/>'+
        '<select id="newuser-role">'+Object.keys(CAP_ROLE_LABELS).map(function(cr){ return '<option value="'+cr+'">'+CAP_ROLE_LABELS[cr]+'</option>'; }).join('')+'</select>'+
        '<button class="btn small primary" onclick="addAccountUser()">افزودن کاربر</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}
function openPackageModal(){ UI.packageModalOpen = true; render(); }
function closePackageModal(){ UI.packageModalOpen = false; render(); }
function buildPackageModal(){
  var groups = {};
  PACKAGES.forEach(function(pk){ groups[pk.group] = groups[pk.group]||[]; groups[pk.group].push(pk); });
  var body = Object.keys(groups).map(function(g){
    var opts = groups[g].map(function(pk){
      return '<div class="wiz-option'+(DB.account.pkgKey===pk.key?' sel':'')+'"><div><div class="t1">'+esc(pk.label)+(DB.account.pkgKey===pk.key?' — بسته فعال حساب':'')+'</div><div class="t2">'+esc(pk.desc)+'</div></div></div>';
    }).join('');
    return '<div style="font-weight:700;font-size:12.5px;margin:14px 0 8px;">'+esc(g)+'</div>'+opts;
  }).join('');
  return '<div class="modal-backdrop" onclick="if(event.target===this) closePackageModal()"><div class="modal-box">'+
    '<div class="modal-head"><h3>بسته‌های سامانه</h3><button class="btn small ghost" onclick="closePackageModal()">✕</button></div>'+
    body+
    '<div class="modal-actions"><span></span><button class="btn small" onclick="closePackageModal()">بستن</button></div>'+
  '</div></div>';
}

function buildWatchlistPickerModal(){
  var wp = UI.watchlistPicker, p = DB.projects[wp.projectId];
  var groupName = DB.companies[p.companyKey].group;
  var siblingCount = Object.keys(DB.projects).filter(function(pid2){
    var p2 = DB.projects[pid2];
    return p2.type===p.type && DB.companies[p2.companyKey].group===groupName;
  }).length;
  var options = Object.keys(DB.watchlists).map(function(wid){
    var w = DB.watchlists[wid];
    return '<div class="wiz-option'+(wp.target===wid?' sel':'')+'" onclick="watchlistPickerSetTarget(\''+wid+'\')"><div><div class="t1">'+esc(w.name)+'</div><div class="t2">'+w.projectIds.length+' پروژه</div></div></div>';
  }).join('');
  var newOpt = '<div class="wiz-option'+(wp.target==='__new__'?' sel':'')+'" onclick="watchlistPickerSetTarget(\'__new__\')"><div><div class="t1">واچ‌لیست جدید</div><div class="t2">ساخت یک واچ‌لیست تازه برای این پروژه</div></div></div>'+
    (wp.target==='__new__' ? '<div class="inline-form" style="margin-bottom:10px;"><input type="text" placeholder="نام واچ‌لیست" oninput="UI.watchlistPicker.newName=this.value" value="'+esc(wp.newName)+'"/></div>' : '');
  var groupOpt = groupName && siblingCount>1 ? '<div class="wiz-option'+(wp.includeGroup?' sel':'')+'" onclick="watchlistPickerSetGroup('+(!wp.includeGroup)+')"><div><div class="t1">افزودن کل گروه «'+esc(groupName)+'»</div><div class="t2">'+siblingCount+' پروژه هم‌نوع در این گروه با هم اضافه شوند</div></div></div>' : '';
  return '<div class="modal-backdrop" onclick="if(event.target===this) closeWatchlistPicker()"><div class="modal-box">'+
    '<div class="modal-head"><h3>افزودن به واچ‌لیست</h3><button class="btn small ghost" onclick="closeWatchlistPicker()">✕</button></div>'+
    options + newOpt + groupOpt +
    '<div class="modal-actions"><span></span><button class="btn small primary" onclick="confirmAddToWatchlist()">افزودن</button></div>'+
  '</div></div>';
}

/* =========================================================================
   کارتابل جزئیات شاخص (KPI drill-down)
   ========================================================================= */
function openKpiDetail(pid, key){ UI.kpiDetail = { pid:pid, key:key }; render(); }
function closeKpiDetail(){ UI.kpiDetail = null; render(); }
function openFieldState(pid, key){ UI.fieldState = { pid:pid, key:key }; render(); }
function closeFieldState(){ UI.fieldState = null; render(); }
function buildFieldStateModal(){
  var d = UI.fieldState;
  if (!d) return '';
  var p = DB.projects[d.pid];
  var key = d.key;
  var f = p && p.fields[key];
  if (!f){ UI.fieldState = null; return ''; }
  var state = computeFieldState(f, p);
  var canEdit = can('editFields');
  var items = f.values.slice().sort(function(a,b){ return a.at-b.at; }).map(function(v){
    var pinned = f.pinnedId===v.id;
    return '<div class="value-item'+(pinned?' pinned':'')+'">'+
      '<span class="pill source '+v.source+'">'+SOURCE_LABEL[v.source]+'</span>'+
      '<span class="v">'+numSpan(f.dataType==='NUMBER'?fmtNum(v.value,2):esc(v.value))+'</span>'+
      (v.confidence!=null ? '<span class="pill muted">اطمینان '+Math.round(v.confidence*100)+'%</span>' : '')+
      '<span style="font-size:10.5px;color:var(--ink-faint);">'+fmtDate(v.at)+'</span>'+
      (pinned ? '<span class="pill ok">انتخابشده</span>' : (canEdit ? '<button class="btn small" onclick="pinValue(\''+d.pid+'\',\''+key+'\',\''+v.id+'\');closeFieldState()">انتخاب این مقدار</button>' : ''))+
    '</div>';
  }).join('');
  var inputId = 'fieldstate-edit-'+key;
  var editForm = canEdit
    ? '<div class="inline-form" style="margin-top:12px;"><input id="'+inputId+'" type="text" placeholder="مقدار جدید (ورود دستی)"/>'+
      '<button class="btn small primary" onclick="submitDirectEdit(\''+d.pid+'\',\''+key+'\',\''+inputId+'\');closeFieldState()">ذخیره و انتخاب</button></div>'
    : gateNote('نقش فعلی («'+DB.people[UI.currentRole].role+'») اجازه ویرایش این داده را ندارد.');
  var note = '';
  if (state.status==='conflict'){
    note = '<div class="value-item" style="border-color:var(--risk);background:var(--risk-tint);"><span class="pill conflict">تعارض منابع</span><span class="v" style="flex:1;">بین منابع مختلف مقادیر متفاوت ثبت شده؛ یکی را انتخاب کنید یا مقدار را دستی اصلاح کنید.</span></div>';
  } else if (state.status==='modified'){
    note = '<div class="value-item" style="border-color:var(--accent);background:var(--accent-tint);"><span class="pill source MANUAL_ENTRY">تغییر توسط کاربر</span><span class="v" style="flex:1;">مقدار نهایی توسط کاربر انتخاب شده است.</span></div>';
  }
  return '<div class="modal-backdrop" onclick="if(event.target===this) closeFieldState()"><div class="modal-box">'+
    '<div class="modal-head"><h3>'+esc(f.label)+'</h3><button class="btn small ghost" onclick="closeFieldState()">✕</button></div>'+
    note+
    '<div style="margin-top:12px;"><div style="font-size:11.5px;font-weight:700;margin-bottom:8px;color:var(--ink-muted);">منابع و تاریخچه مقادیر</div>'+
    '<div class="value-list">'+items+'</div></div>'+
    editForm+
    '<div class="modal-actions"><span></span><button class="btn small" onclick="closeFieldState()">بستن</button></div>'+
  '</div></div>';
}
function buildKpiSourceFieldsSection(p, kpiKey){
  var keys = KPI_SOURCE_FIELDS[kpiKey];
  if (!keys || !keys.length) return '';
  var rows = keys.map(function(k){
    var f = p.fields[k];
    if (!f) return '';
    var state = computeFieldState(f, p);
    var resolved = state.resolved;
    var valText = resolved ? (f.dataType==='NUMBER' ? fmtNum(resolved.value, 2) : esc(resolved.value)) : '—';
    var srcBadge = resolved ? '<span class="pill source '+resolved.source+'">'+SOURCE_LABEL[resolved.source]+'</span>' : '';
    return '<div class="value-item" style="gap:8px;cursor:pointer;" onclick="event.stopPropagation();openFieldState(\''+p.id+'\',\''+k+'\')" title="مشاهده منابع و تاریخچه">'+
      fieldStateDot(state, p.id, k)+
      '<span class="v" style="flex:1;word-break:break-word;font-weight:600;">'+esc(f.label)+'</span>'+
      '<span class="num" style="font-family:var(--font-num);font-weight:700;">'+numSpan(valText)+'</span>'+
      srcBadge+
    '</div>';
  }).join('');
  return '<div style="margin-top:14px;"><div style="font-size:11.5px;font-weight:700;margin-bottom:6px;color:var(--ink-muted);">داده‌های تغذیه‌کننده این شاخص</div>'+
    '<div class="value-list">'+rows+'</div></div>';
}
function buildKpiDetailModal(){
  var d = UI.kpiDetail, p = d && DB.projects[d.pid];
  if (!p || !p.kpiState[d.key]){ UI.kpiDetail = null; return ''; }
  var st = p.kpiState[d.key], def = KPI_DEFS[d.key] || {};
  var status = heatStatus(p, d.key);
  var imp = KPI_IMPORTANCE[def.importance] || KPI_IMPORTANCE.medium;
  var cat = KPI_CATEGORIES[def.category];
  var delta = (st.value!=null && st.prev!=null) ? (st.value - st.prev) : null;
  var deltaColor = delta==null ? 'inherit' : (delta>0?'var(--positive)':(delta<0?'var(--negative)':'inherit'));
  var statusVar = status==='ok'?'--positive':(status==='warn'?'--gold':'--negative');

  return '<div class="modal-backdrop" onclick="if(event.target===this) closeKpiDetail()"><div class="modal-box">'+
    '<div class="modal-head">'+
      '<div style="display:flex;align-items:center;gap:10px;min-width:0;">'+
        (cat ? '<span class="cat-badge '+cat.cls+'">'+cat.letter+'</span>' : '')+
        '<h3 style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(st.label)+'</h3>'+
      '</div>'+
      '<button class="btn small ghost" onclick="closeKpiDetail()">✕</button>'+
    '</div>'+
    (def.description ? '<p style="font-size:12.5px;color:var(--ink-muted);line-height:1.8;margin:10px 0 14px;">'+esc(def.description)+'</p>' : '')+
    '<div class="kpi-modal-stat"><span class="l">مقدار فعلی</span><span class="v">'+numSpan(esc(fmtByFormat(st.value, st.format)))+'</span></div>'+
    '<div class="kpi-modal-stat"><span class="l">مقدار قبلی ثبت‌شده</span><span class="v">'+(st.prev!=null ? numSpan(esc(fmtByFormat(st.prev, st.format))) : '—')+'</span></div>'+
    '<div class="kpi-modal-stat"><span class="l">تغییر نسبت به مقدار قبلی</span><span class="v" style="color:'+deltaColor+';">'+(delta==null ? '—' : numSpan(esc((delta>0?'+':'')+fmtByFormat(delta, st.format))))+'</span></div>'+
    '<div class="kpi-modal-stat"><span class="l">اهمیت شاخص</span><span class="v" style="color:'+imp.color+';font-family:inherit;">'+imp.label+'</span></div>'+
    (status ? '<div class="kpi-modal-stat"><span class="l">وضعیت</span><span class="v" style="color:var('+statusVar+');font-family:inherit;">'+heatLabel(status)+'</span></div>' : '')+
    (def.formulaText ? '<div style="margin-top:14px;"><div style="font-size:11.5px;font-weight:700;margin-bottom:6px;color:var(--ink-muted);">فرمول محاسبه</div><div class="kpi-modal-formula">'+esc(def.formulaText)+'</div></div>' : '')+
    buildKpiSourceFieldsSection(p, d.key)+
    '<div class="modal-actions"><span></span><button class="btn small" onclick="closeKpiDetail()">بستن</button></div>'+
  '</div></div>';
}

function render(){
  var printArea = document.getElementById('printArea');
  if (UI.externalPreview){ document.getElementById('screenRoot').innerHTML = localizeHtml(buildExternalApprovalScreen()); printArea.innerHTML=''; return; }
  if (UI.stage==='landing'){ document.getElementById('screenRoot').innerHTML = localizeHtml(buildLandingPage()); printArea.innerHTML=''; return; }
  if (UI.stage==='checkout'){ document.getElementById('screenRoot').innerHTML = localizeHtml(buildCheckoutPage()); printArea.innerHTML=''; return; }
  if (UI.stage==='login'){ document.getElementById('screenRoot').innerHTML = localizeHtml(buildLoginPage()); printArea.innerHTML=''; return; }

  var main;
  if (UI.view==='users' && !can('manageUsers')) UI.view = 'portfolio';

  if (UI.view==='portfolio') main = '<div class="topbar"><div><div class="crumb">'+esc(DB.account.name)+'</div><h2>پرتفوی پروژه‌ها</h2></div></div>' + buildPortfolio();
  else if (UI.view==='account') main = '<div class="topbar"><div><div class="crumb">'+esc(DB.account.name)+'</div><h2>داشبورد حساب</h2></div></div>' + buildAccountDashboard();
  else if (UI.view==='project') main = buildProjectView();
  else if (UI.view==='watchlists') main = buildWatchlistsIndexView();
  else if (UI.view==='watchlist') main = buildWatchlistView();
  else if (UI.view==='users') main = '<div class="topbar"><div><div class="crumb">'+esc(DB.account.name)+'</div><h2>کاربران و دسترسی‌ها</h2></div></div>' + buildUsersView();

var isProjectView =
  UI.view === 'project';


var globalRailHtml =
  isProjectView
    ? ''
    : '<aside class="rail">'+buildRail()+'</aside>';


var contentClass =
  isProjectView
    ? 'content project-content'
    : 'content';


document.getElementById('screenRoot').innerHTML = localizeHtml(

  globalRailHtml+

  '<main class="'+contentClass+'">'+
    main+
  '</main>'+

  (UI.wizard
    ? buildWizard()
    : ''
  )+

  (UI.watchlistPicker
    ? buildWatchlistPickerModal()
    : ''
  )+

  (UI.packageModalOpen
    ? buildPackageModal()
    : ''
  )+

  (UI.kpiDetail
    ? buildKpiDetailModal()
    : ''
  )+

  (UI.fieldState
    ? buildFieldStateModal()
    : ''
  )+

  (UI.wcEditor
    ? buildWCEditor(UI.projectId)
    : ''
  )+

  (UI.fEditor
    ? buildFEditor(UI.projectId)
    : ''
  )+

  (UI.feEditor
    ? buildFixedEditor(UI.projectId)
    : ''
  )+

  (UI.oEditor
    ? buildOEditor(UI.projectId)
    : ''
  )+

  (UI.roleModalOpen
    ? buildRoleModal()
    : ''
  )+

  (UI.approverEditor
    ? buildApproverEditorModal()
    : ''
  )+

  (UI.priorityEditor
    ? buildPriorityEditorModal()
    : ''
  )

);

  if (UI.view==='project' && UI.tab==='report' && DB.projects[UI.projectId]){
    printArea.innerHTML = localizeHtml(buildReportPagesHTML(DB.projects[UI.projectId], true));
  } else {
    printArea.innerHTML = '';
  }
}

initTheme();
seed();
render();
document.addEventListener(
  'click',
  function(e){

    var target =
      e.target;


    var insideField =
      target.closest(
        '.field-row'
      ) ||
      target.closest(
        '.field-detail'
      ) ||
      target.closest(
        '.inline-form'
      );


    if(!insideField &&
       UI.expandedField){

      UI.expandedField = null;

      render();

    }

  }
);
</script>
</body>
</html>
